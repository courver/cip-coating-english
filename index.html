<style>
/* Layout: an inspector's logbook — draft-mark ruler down the left edge, one working column, tabs as log sections */
:root{
  --bg:#E9EEF1; --surface:#F7F9FA; --ink:#13232D; --muted:#566874; --line:#C3CED5;
  --sea:#1C5A73; --sea-soft:#D3E3EA; --accent:#D9531C; --accent-soft:#F8E1D6;
  --ok:#2C7A4B; --ok-soft:#DCEFE3; --bad:#B02A1E; --bad-soft:#F6DCD9;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A161D; --surface:#102230; --ink:#E2EBEF; --muted:#8EA2AD; --line:#23404F;
  --sea:#62B4D4; --sea-soft:#163545; --accent:#FF7B42; --accent-soft:#3A2116;
  --ok:#5CC487; --ok-soft:#153325; --bad:#FF7A6E; --bad-soft:#3B1814; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A161D; --surface:#102230; --ink:#E2EBEF; --muted:#8EA2AD; --line:#23404F;
  --sea:#62B4D4; --sea-soft:#163545; --accent:#FF7B42; --accent-soft:#3A2116;
  --ok:#5CC487; --ok-soft:#153325; --bad:#FF7A6E; --bad-soft:#3B1814; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;position:relative}
.ruler{position:fixed;left:0;top:0;bottom:0;width:10px;background:repeating-linear-gradient(to bottom,var(--accent) 0 2px,transparent 2px 20px);opacity:.55;pointer-events:none}
@media (max-width:600px){.ruler{display:none}}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand h1 small{display:block;font-size:.42em;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13px}
.stats{display:flex;gap:16px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.stats b{display:block;font-size:20px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin:14px 0 18px;border-bottom:1px solid var(--line);scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font:600 15px var(--f-body);color:var(--muted);cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.devices{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted);margin-top:-8px;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;background:var(--surface)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.on i{background:var(--ok)} .pill.off i{background:var(--bad)}
h2{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0 0 4px;letter-spacing:.01em}
h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0 0 6px;letter-spacing:.02em}
.lede{color:var(--muted);margin:0 0 16px;max-width:65ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 11px;font:500 13px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.7;margin-left:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.prompt{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,6vw,38px);line-height:1.15;margin:4px 0 4px;word-break:break-word;text-wrap:balance}
.prompt.cn{font-family:var(--f-body);font-weight:700}
.sub{color:var(--muted);font-size:13px}
.meta{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px 12px;font:500 15px var(--f-body);cursor:pointer;display:flex;gap:10px;align-items:flex-start;min-width:0}
.opt kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;flex:0 0 auto;margin-top:2px}
.opt span{min-width:0;word-break:break-word}
.opt:hover:not(:disabled){border-color:var(--sea)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)} .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 14px;font:600 14px var(--f-body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fb{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.fb .verdict{font-weight:700} .fb .verdict.ok{color:var(--ok)} .fb .verdict.no{color:var(--bad)}
.note{font-size:12px;background:var(--accent-soft);color:var(--ink);border-radius:4px;padding:2px 8px;display:inline-block;margin-top:6px}
.ex{border-left:3px solid var(--sea);padding:6px 0 6px 12px;margin-top:10px}
.ex .en{font-size:15px} .ex .cn{color:var(--muted);font-size:13px}
.ex .src{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
mark{background:var(--accent-soft);color:inherit;padding:0 2px;border-radius:3px;font-weight:600}
.blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--accent);color:transparent}
input[type=text],input[type=number],select{font:500 16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-width:0}
.spell-in{font-family:var(--f-mono)!important;font-size:20px!important}
.mic{width:76px;height:76px;border-radius:50%;border:3px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.mic svg{width:30px;height:30px}
.mic.live{background:var(--accent);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent-soft)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none}}
.heard{font-family:var(--f-mono);font-size:14px;min-height:1.6em;color:var(--muted)}
.words span{display:inline-block;margin:2px 3px;padding:0 4px;border-radius:3px}
.words .h{background:var(--ok-soft);color:var(--ok)} .words .m{background:var(--bad-soft);color:var(--bad)}
.gauge{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0}
.gauge i{display:block;height:100%;background:var(--sea);transition:width .4s}
.score{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:720px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:4px;min-width:0}
.mode:hover{border-color:var(--sea)}
.mode .k{font-family:var(--f-mono);font-size:11px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.mode b{font-family:var(--f-display);font-size:21px;font-weight:700}
.mode span{color:var(--muted);font-size:13px}
.progress-list{display:grid;gap:8px;margin-top:6px}
.progress-list .pl{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.progress-list .pl .v{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.quote{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:14px 16px;background:var(--surface);margin:18px 0}
.quote .en{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.25}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--surface)}
td.en{font-weight:600}
td .tag{font-size:11px;border-radius:3px;padding:0 5px;margin-left:4px;background:var(--sea-soft);color:var(--sea);white-space:nowrap}
.icon-btn{background:none;border:1px solid var(--line);border-radius:6px;color:var(--sea);cursor:pointer;padding:3px 7px;font-size:13px;line-height:1}
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.calc{grid-template-columns:1fr}}
.calc label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.readout{font-family:var(--f-mono);font-size:14px;margin-top:12px;padding:12px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.readout b{font-size:18px}
.st-ok{color:var(--ok);font-weight:700} .st-no{color:var(--bad);font-weight:700}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.kw span{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 7px;color:var(--muted)}
.kw span.h{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.empty{color:var(--muted);padding:20px 0}
/* study plan */
.ready{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:520px){.ready{grid-template-columns:1fr}}
.ready .panel{padding:14px 16px}
.ready .lv{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.ready .pct{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tasks{display:grid;gap:6px;margin:8px 0 18px}
.task{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--surface)}
.task .box{width:18px;height:18px;border:2px solid var(--line);border-radius:4px;display:grid;place-items:center;font-size:12px;color:#fff}
.task.done .box{background:var(--ok);border-color:var(--ok)}
.task.done .tt{color:var(--muted);text-decoration:line-through}
.task .tt small{display:block;color:var(--muted);font-size:12px;text-decoration:none}
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:18px}
@media (max-width:560px){.mods{grid-template-columns:1fr}}
.mod{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
.mod:hover{border-color:var(--sea)}
.mod .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mod b{font-size:15px} .mod .v{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.mod .e{font-size:12px;color:var(--muted)}
.mod.weak{border-left:3px solid var(--accent)}
.points{margin:8px 0 0;padding-left:1.2em;display:grid;gap:6px;max-width:70ch}
.points b{color:var(--sea)}
.timer{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.breakdown{display:grid;gap:6px;margin:10px 0}
.breakdown .pl{display:grid;grid-template-columns:minmax(0,150px) 1fr 60px;gap:10px;align-items:center;font-size:13px}
.breakdown .v{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--muted)}
.acttags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.acttags span{font-size:11px;border-radius:3px;padding:0 6px;background:var(--sea-soft);color:var(--sea)}
/* adventure */
.hud{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:end;margin-bottom:10px}
.hud .chap{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.hud h2{margin:2px 0 0}
.hud .place{color:var(--muted);font-size:13px}
.meters{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.meter{min-width:96px}
.meter b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.meter .gauge{height:6px;margin:3px 0 0}
.meter.hull .gauge i{background:var(--ok)} .meter.hull.low .gauge i{background:var(--bad)}
.meter.trust .gauge i{background:var(--accent)}
.advbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.stage{border:1px solid var(--line);border-radius:12px;padding:18px clamp(14px,3vw,26px) 22px;background:linear-gradient(180deg,color-mix(in srgb,var(--sea) var(--deep,10%),var(--surface)) 0%,var(--surface) 70%);position:relative;overflow:hidden}
.stage::after{content:attr(data-depth);position:absolute;right:14px;top:12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--muted)}
.feed{display:flex;flex-direction:column;gap:12px}
.nar{margin:0;color:var(--muted);font-size:14px;max-width:65ch}
.line{max-width:68ch;animation:rise .35s ease both}
.line .who{font-weight:700;font-size:13px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.line .who span{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted)}
.line .who .src{color:var(--sea);border:1px solid var(--line);border-radius:3px;padding:0 5px}
.line .en{font-size:17px;line-height:1.5;margin-top:2px}
.line.q.narr .en{font-style:italic}
.line .cn{color:var(--muted);font-size:13px}
.line.l .who{color:var(--accent)}
.nocn .line .cn,.nocn .chal .sub.cnq{display:none}
.rec{font-size:13px;font-family:var(--f-mono);border-left:3px solid var(--line);padding:2px 0 2px 10px;color:var(--muted)}
.rec.ok{border-color:var(--ok)} .rec.no{border-color:var(--bad)}
.chal{border-top:2px solid var(--ink);margin-top:16px;padding-top:14px}
.chal .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.chal .cq{font-size:17px;font-weight:600;line-height:1.45;margin-top:4px}
.cont{margin-top:16px}
.dewtbl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0;font-family:var(--f-mono)}
.dewtbl div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.dewtbl small{display:block;color:var(--muted);font-size:11px}
.dewtbl b{font-size:20px}
.endcard{text-align:left}
.endcard .big{font-family:var(--f-display);font-size:clamp(28px,6vw,40px);font-weight:700;line-height:1.1}
.chlist{display:grid;gap:6px;margin-top:10px}
.chlist button{text-align:left}
@keyframes rise{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.line{animation:none}}
#toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.5;box-shadow:0 6px 24px rgba(0,0,0,.25)}
footer{margin-top:40px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
footer a{color:var(--sea)}
</style>

<div class="ruler" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><small>PGR 42 · Steering by Light · CIP</small>歧海循光涂装英语</h1>
      <p>AMPP CIP 一级、二级备考：按模块学要点、刷题、模拟考；再跟着卡列尼娜走一遍第 42 章，用英语做涂装检测。</p>
    </div>
    <div class="stats" aria-live="polite">
      <div><b id="st-xp">0</b>XP</div>
      <div><b id="st-streak">0</b>连对</div>
      <div><b id="st-master">0</b>已掌握</div>
    </div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="devices"><span class="pill" id="dev-tts"><i></i>朗读：检测中</span><span class="pill" id="dev-mic"><i></i>录音：检测中</span>
    <label class="pill" style="cursor:pointer">语速 <select id="rate" style="width:auto;padding:0 4px;font-size:12px;border:0;background:transparent"><option value="0.8">慢</option><option value="1" selected>正常</option><option value="1.2">快</option></select></label>

<script>
const VOCAB=[{"cn": "救助打捞船", "en": "salvage vessel", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "船东", "en": "owner", "cat": "ships", "note": "", "ex": [{"en": "Cordelia, the original owner of Rarana. You mentioned her before. Did she... did she have a child?", "cn": "柯黛里娅，你说的拉拉纳原本的主人，她……有孩子吗？", "sp": "Karenina", "sec": "42-12 The Reasonless Law of Birth", "hit": "owner"}, {"en": "They were like visitors who had borrowed a place to rest and now slipped quietly away the moment the owner returned.", "cn": "就像是借地休息的访客，当主人归来，默默离开一般。", "sp": "", "sec": "42-16 Requiem", "hit": "owner"}, {"en": "On your terminal, the anchor weapon's control icon still pulses, which means its owner is alive somewhere in this world.", "cn": "终端中，船锚武器控制系统的图标仍然闪烁，这说明它的所有者依然鲜活地存在于这个世上。", "sp": "", "sec": "42-25 But the Sea Runs Deep", "hit": "owner"}], "gen": true}, {"cn": "潜水器", "en": "submersible", "cat": "ships", "note": "", "ex": [{"en": "We have the coordinates. We have the submersible route. We can take the survivors to Atlantis. Then we'll definitely—", "cn": "我们现在有他们的准确坐标和潜航路线，完全可以带上幸存者去往亚特兰蒂斯，就一定——", "sp": "Larsen", "sec": "42-11 Riotous Corrosion", "hit": "submersible"}], "gen": false}, {"cn": "机务", "en": "superintendent", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "破冰船", "en": "ice-breaker", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "主管", "en": "repair manager", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "渔业船", "en": "fishery vessel", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "船长", "en": "captain", "cat": "ships", "note": "", "ex": [{"en": "This is Faye of Begonia Star... no, I'm the acting captain now. Captain... he's...", "cn": "我是棠星小队的逢江……不，我是临时队长，队长他已经……", "sp": "", "sec": "42-1 Tide and Sound", "hit": "captain"}, {"en": "Th-this is Faye, acting captain of Begonia Star. Transmission... o-over...", "cn": "我、我是棠星小队的临时队长逢江，播报……完……完毕。", "sp": "Military Comms", "sec": "42-1 Tide and Sound", "hit": "captain"}, {"en": "And Karenina, in turn, would never let her vice-captain set foot on those treacherous waters like this.", "cn": "卡列尼娜也不会将这样的副队长置于危机四伏的海洋上。", "sp": "", "sec": "42-1 Tide and Sound", "hit": "captain"}], "gen": false}, {"cn": "拖网鱼船", "en": "trawler", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "大副", "en": "chief mate/first officer", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "围网鱼船", "en": "seine netter", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "二副", "en": "second officer", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "港务船", "en": "harbour boat", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "三副", "en": "third officer", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "供应船", "en": "supply ship", "cat": "ships", "note": "", "ex": [{"en": "Dock 2, normally reserved for supply ships, had become a waystation for the fallen. Its empty cargo apron now held the dead.", "cn": "2号港口通常是补给船的停泊位，如今空旷的卸货坪，变成了故去之人暂时停留的终点站。", "sp": "", "sec": "42-12 The Reasonless Law of Birth", "hit": "supply ships"}], "gen": false}, {"cn": "水手长", "en": "bosun / boatswain", "cat": "ships", "note": "原表 boson", "ex": [], "gen": false}, {"cn": "游艇", "en": "pleasure yacht", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "木匠", "en": "carpenter", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "水翼船", "en": "hydrofoil craft", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "大管轮", "en": "second engineer", "cat": "ships", "note": "原表写 chief engineer；轮机长才是 chief engineer", "ex": [], "gen": false}, {"cn": "气垫船", "en": "air-cushion vehicle", "cat": "ships", "note": "原表 air-cashion", "ex": [], "gen": false}, {"cn": "电机员", "en": "electrical engineer", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "全垫升气垫船", "en": "hovercraft", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "铜匠", "en": "fitter", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "双体船", "en": "catamaran", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "修理工", "en": "repairer", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "水泥船", "en": "concrete ship", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "厨师", "en": "cook", "cat": "ships", "note": "", "ex": [{"en": "Because crabs turn red when you cook them. No more talking. Go back to sleep.", "cn": "因为螃蟹熟了就是红色的，不许说话了，快睡觉。", "sp": "Cordelia", "sec": "42-21 Trivial Yet Precious Things", "hit": "cook"}], "gen": true}, {"cn": "玻璃钢船", "en": "fiberglass reinforced boat", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "船员", "en": "crew", "cat": "ships", "note": "", "ex": [{"en": "I stayed behind to wait for the new crew. And to wait for you.", "cn": "我留在这里，是在等新的队员，也是在等你。", "sp": "Mara", "sec": "42-3 Song of the Whale", "hit": "crew"}, {"en": "While Karenina exercises discipline over her crew, a sound rises from the deep, pitched well below the range of human ears.", "cn": "就在卡列尼娜“严格御下”的同时，人类听力的范围之外，一道低于监测阈值的声音正从深海传来。", "sp": "", "sec": "42-3 Song of the Whale", "hit": "crew"}, {"en": "Commandant, one crew member on the Vega is badly hurt. The rest have minor injuries, nothing serious... But they're refusing to head back for repairs.", "cn": "指挥官，织女星号上一人重伤，其余人轻微伤，都没有大碍……只是，他们不愿意返航检修。", "sp": "Lucia", "sec": "42-4 Homeward Current", "hit": "crew"}], "gen": false}, {"cn": "特种船", "en": "special-purpose ship", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "工人", "en": "workman", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "渡船", "en": "ferry boat", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "工头", "en": "foreman", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "液体散货船", "en": "liquid bulk/cargo carrier", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "承包商", "en": "subcontractor", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "混装散货船", "en": "combination bulk carrier", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "原始资料", "en": "initial data", "cat": "ships", "note": "原表 initial date", "ex": [], "gen": false}, {"cn": "远洋矿砂船", "en": "ocean-going ore carrier", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "冲击/碰撞", "en": "impact", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "油船", "en": "tanker", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "港籍", "en": "home port", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "客货船", "en": "passenger-cargo ship", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "载重标志", "en": "draft marks", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "运输船", "en": "transport ship", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "引水标志", "en": "pilot marks", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "杂货船", "en": "general cargo ship", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "泊位", "en": "berth", "cat": "ships", "note": "", "ex": [{"en": "Heavy equipment's all at Berth 6, tied up in loading ops. Even if we called them now, it'd be fifteen minutes minimum...", "cn": "大型设备在六号泊位装船，都在工程作业中，赶过来至少需要十五分钟……", "sp": "Dock Worker", "sec": "42-2 A White-Hot Soul", "hit": "Berth"}], "gen": false}, {"cn": "冷藏船", "en": "refrigerated ship", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "港务局", "en": "port authority", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "工程船", "en": "working ship", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "船台", "en": "slipway", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "海洋开发船", "en": "ocean development ship", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "舾装", "en": "outfitting", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "挖泥船", "en": "dredger", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "海试", "en": "sea-trial", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "起重船", "en": "floating crane/derrick boat", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "测爆", "en": "gas free", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "集装箱船", "en": "container ship", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "焊接", "en": "welding", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "滚装船", "en": "roll-on/roll-off ship", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "气焊", "en": "gas welding", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "拖车运输船", "en": "trailer ship", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "焊缝", "en": "weld seam", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "火车渡轮", "en": "sea train ferry", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "大接缝", "en": "master butt", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "军用车辆运输船", "en": "military vehicle carrier", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "组装/装配", "en": "assembly", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "载驳船", "en": "barge-carrying ship", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "小合拢装配", "en": "prefabrication", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "（港）驳船", "en": "lighter", "cat": "ships", "note": "", "ex": [{"en": "Her voice grows weaker, each word lighter than the last, until the faintest breaths die out quicker than the transmission.", "cn": "女孩的声音越来越虚弱，直至最后那几个轻不可闻的气音，消失得比信号更快。", "sp": "", "sec": "42-1 Tide and Sound", "hit": "lighter"}, {"en": "At the main corridor entrance, Onni reached into his pocket without thinking and pulled out the cigarette Gunnar had left him, flicking his lighter.", "cn": "主通道口，昂尼下意识地摸出了那根来自贡纳尔的烟，叩响了火机。", "sp": "", "sec": "42-20 Drowned in the Wind", "hit": "lighter"}, {"en": "Onni worked the lighter repeatedly, and each small flame sparked to life before the dark swallowed it back.", "cn": "昂尼点了几次，火星刚刚点燃，又很快熄灭。", "sp": "", "sec": "42-20 Drowned in the Wind", "hit": "lighter"}], "gen": true}, {"cn": "船台", "en": "building berth/slipway", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "驳船", "en": "barge", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "船台装配", "en": "erection", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "散装货船", "en": "bulk carrier", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "船台开工/铺龙骨", "en": "keel laid", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "驱逐舰", "en": "destroyer", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "对讲机", "en": "walkie-talkie", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "钻井船", "en": "drilling ship", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "图表", "en": "diagram", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "件杂货船", "en": "break-bulk cargo ship", "cat": "ships", "note": "", "ex": [], "gen": false}, {"cn": "船长", "en": "length overall (LOA)", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "堵塞", "en": "chock up", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "船宽", "en": "breadth molded", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "测深仪", "en": "echo sounder", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "型深", "en": "depth Molded", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "计程仪", "en": "log", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "重载水线", "en": "deep load line", "cat": "hull", "note": "原表 D.L.L.(design limit load)", "ex": [], "gen": false}, {"cn": "防鼠挡板", "en": "rat-guard", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "轻载水线", "en": "L.L.L.(light load line)", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "舭（船底弯曲部）", "en": "bilge", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "吃水", "en": "draft", "cat": "hull", "note": "", "ex": [{"en": "Given the declared total displacement, what should the theoretical draft be?", "cn": "按照申报的总排水量，理论吃水应该是多少？", "sp": "Cordelia", "sec": "42-5 Winding Waves", "hit": "draft"}, {"en": "Without warning, Cordelia drops her brush into the bucket, crushes a spoiled draft into a tight ball, and flings it at Kalon.", "cn": "这时候，柯黛里娅把手中的画笔也扔进了桶里，将一张废画稿捏成一团，扔到了卡农身上。", "sp": "", "sec": "42-25 But the Sea Runs Deep", "hit": "draft"}], "gen": true}, {"cn": "舭龙骨", "en": "bilge keel", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "船体", "en": "hull", "cat": "hull", "note": "", "ex": [{"en": "Mayday. Our hull is listing fifteen degrees now...", "cn": "Mayday，我们的船体已经倾斜十五度……", "sp": "Feeble Male Voice", "sec": "42-1 Tide and Sound", "hit": "hull"}, {"en": "Karenina's face tightens with purpose. She turns to look down at the massive hull beneath her.", "cn": "卡列尼娜面色一整，转身，俯视这艘巨轮。", "sp": "", "sec": "42-3 Song of the Whale", "hit": "hull"}, {"en": "Mara takes a moment. Her gaze travels back across the port, skimming the Balder's hull, until it rests on the open water, endless and gray-blue in the distance.", "cn": "玛拉没有立刻回答，她重新看向港口，越过巴德尔号的船身，更远处是那灰蓝色的辽阔海面。", "sp": "", "sec": "42-3 Song of the Whale", "hit": "hull"}], "gen": false}, {"cn": "舷墙", "en": "bulwark", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "船壳", "en": "shell", "cat": "hull", "note": "", "ex": [{"en": "A whisper of sound stirred, barely audible. Some clumsy creature of the deep had strayed against the prison's outer shell.", "cn": "一声微不可闻的轻响，某条笨拙的深海鱼，无意间撞上了这座监牢的外壁。", "sp": "", "sec": "42-1 Tide and Sound", "hit": "shell"}, {"en": "The round punched through its shell, and thick red ichor sprayed into the sea.", "cn": "子弹击穿了它的甲壳，粘稠的红色浆体喷溅出来，落进海里。", "sp": "", "sec": "42-9 Starsea in Bloom", "hit": "shell"}, {"en": "A blade scrapes across the Corrupted's metal shell, the shriek of steel on steel echoing with the pounding heart.", "cn": "刀尖划过感染体的金属面，刺耳的声音在耳膜上同鼓噪的心跳一起噪响。", "sp": "", "sec": "42-19 Protocol Buffer", "hit": "shell"}], "gen": true}, {"cn": "舷墙排水孔", "en": "wash port", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "干舷", "en": "topside", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "舷梯", "en": "gangway", "cat": "hull", "note": "", "ex": [{"en": "Only three more steps. Three more steps up that long gangway, and she would have been aboard the ship.", "cn": "差一点，就差三个台阶，自己就能跨上那长长的梯子，登上远航船。", "sp": "", "sec": "42-11 Riotous Corrosion", "hit": "gangway"}, {"en": "At last, Lumi spotted the long gangway. Beside it, Lyndae and the soldiers had formed two lines, the final wall between the Corrupted and the vessel.", "cn": "终于，露米看到了那条长梯。长梯旁，林代和军人们分作两排，作为最后的阵线守护着舰船。", "sp": "", "sec": "42-15 Ship of Mortals", "hit": "gangway"}, {"en": "The mass of people drew inward, converging on the gangway. The horn seemed to madden the Corrupted, sending them into a wilder, more desperate frenzy.", "cn": "人群开始收缩，向长梯靠拢。感染体似乎受汽笛刺激，愈发狂暴。", "sp": "", "sec": "42-15 Ship of Mortals", "hit": "gangway"}], "gen": false}, {"cn": "水线区", "en": "boottop", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "舷边栏杆", "en": "gunwale rail", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "直底", "en": "vertical bottom", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "舷墙立柱", "en": "bulwark stay", "cat": "hull", "note": "原表 walk stay", "ex": [], "gen": false}, {"cn": "平底", "en": "flat bottom", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "舷窗", "en": "porthole", "cat": "hull", "note": "", "ex": [{"en": "When the terminal screen glows to life, Lee is standing by the porthole.", "cn": "终端屏幕亮起时，里正站在舷窗边。", "sp": "", "sec": "42-3 Song of the Whale", "hit": "porthole"}, {"en": "At the base's port, the sea wind brushed past the Karenin's portholes, pulling them toward that dark expanse of ocean.", "cn": "基地港口，海风拂过卡列宁号的舷窗，牵引着他们走向那片黑暗的海。", "sp": "", "sec": "42-8 When the Fairy Tale Sank", "hit": "portholes"}, {"en": "In an instant, the lights went out. The engines in th er", "ex": [], "gen": false}, {"cn": "船艏", "en": "bow", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "灯桅", "en": "lamp mast", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "船艉", "en": "stern", "cat": "hull", "note": "", "ex": [{"en": "The sea churns around the hull, a white skirt of foam unfurling behind the stern as the vessel heads toward the South Atlantic.", "cn": "海水环绕着船身翻涌，浪裙缀在船尾渐渐拉长，驶向南大西洋。", "sp": "", "sec": "42-3 Song of the Whale", "hit": "stern"}, {"en": "Through her Construct senses, Karenina feels the faint vibration running up from the deck, the rhythm of the stern thrusters pulsing steady as heartbeats.", "cn": "以构造体的敏锐感官，卡列尼娜能准确地感知到脚下的地板传来的微微震颤——那是船尾推进系统的脉动，均匀得像心跳。", "sp": "", "sec": "42-3 Song of the Whale", "hit": "stern"}, {"en": "The base commander silenced him with a stern, cutting voice.", "cn": "基地的最高长官用严厉的声音喝止了他。", "sp": "", "sec": "42-5 Winding Waves", "hit": "stern"}], "gen": false}, {"cn": "吊艇臂", "en": "davit arm", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "系泊设备", "en": "mooring arrangement", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "桅柱", "en": "derrick post", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "系缆柱", "en": "bitt / bollard", "cat": "hull", "note": "原表 bit", "ex": [], "gen": false}, {"cn": "克令吊", "en": "crane", "cat": "hull", "note": "", "ex": [{"en": "At the edge of a container's shadow, Cordelia looked up at the crane's boom, suspended high and swaying faintly, as unsteady as her own thoughts.", "cn": "柯黛站在集装箱阴影的边缘，目光越过起重机的吊臂，那吊臂悬得很高，有些摇摇欲坠，就像她此刻的心情。", "sp": "", "sec": "42-2 A White-Hot Soul", "hit": "crane"}, {"en": "A few seconds of silence pass. Larsen cranes his neck and takes in the holding tank, which contains absolutely nothing.", "cn": "卡列尼娜沉默了几秒，拉森探过头，看了看空荡荡的储鱼箱。", "sp": "", "sec": "42-3 Song of the Whale", "hit": "cranes"}], "gen": false}, {"cn": "导缆钳", "en": "chock", "cat": "hull", "note": "", "ex": [], "gen": false}, {"cn": "吊杆", "en": "boom" ": "42-16 Requiem", "hit": "external"}, {"en": "It resembles an external energy core, its surface traced with lines that shimmer with a soft glow as light plays across them.", "cn": "看起来像某种外接式的能源核心，表面的纹路在光线下反射出柔和的光泽。", "sp": "", "sec": "42-18 New World Never Was", "hit": "external"}, {"en": "Alternatively, as you have done before, you could employ an external communications device augmented by the lighthouse's authority to establish outside contact.", "cn": "或者像您之前所做的那样，利用外部通讯设备，辅以灯塔中枢的权重，进行对外联络。", "sp": "", "sec": "42-21 Trivial Yet Precious Things", "hit": "external"}], "gen": true}, {"cn": "集尘器", "en": "dust collector", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "内部", "en": "internal", "cat": "shop", "note": "", "ex": [{"en": "The glow was dim, a sure sign the power had drained. Cordelia carefully connected an energy core to its internal port.", "cn": "光线有些暗，这是没电的标志。柯黛里娅将能源核心小心地接入它的内置端口。", "sp": "", "sec": "42-2 A White-Hot Soul", "hit": "internal"}, {"en": "Karenina knows the name from the Cosmos Technicians Union's internal records, but she has never had any contact with this supposedly remarkable technician in her life.", "cn": "卡列尼娜在寰宇技师工会的内部资料里见过这个名字，但在过去的生活里，她从未与这个据说很厉害的老师有过交集。", "sp": "", "sec": "42-3 Song of the Whale", "hit": "internal"}, {"en": "Through the viewport, Karenina's frame materializes, and a faint tremor from the internal climate system hums against your palm, steady as breathing.", "cn": "透明的视窗显露出卡列尼娜机体的模样，内部温控系统运转的微弱震动从掌心传来，仿佛某种恒定的呼吸。", "sp": "", "sec": "42-4 Homeward Current", "hit": "internal"}], "gen": true}, {"cn": "照明", "en": "illumination", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "高压淡水冲洗", "en": "HPFW", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "油/黄油", "en": "grease", "cat": "shop", "note": "", "ex": [{"en": "Larsen looks down. The hand gripping the helm grows young again, the skin smoothing over, the scars retreating, the grease stains buried under his nails vanishing.", "cn": "拉森低头看自己的手。那只握着舵轮的手正在变得年轻，皮肤光滑，伤疤褪去，指甲里嵌着的机油痕迹消失无踪。", "sp": "", "sec": "42-25 But the Sea Runs Deep", "hit": "grease"}], "gen": true}, {"cn": "酸洗", "en": "pickling", "cat": "shop", "note": "原表 picking", "ex": [], "gen": false}, {"cn": "抹布", "en": "rag", "cat": "shop", "note": "", "ex": [{"en": "Behind her, the fire rages. Around her, the waves heave. And in this single, transient breath, she kindles a path made of light.", "cn": "火焰在身后燃烧，海浪在四周翻涌，在这短暂的一刻，她点燃了光的道路。", "sp": "", "sec": "42-14 Folded Course", "hit": "rages"}, {"en": "Fire rages through Karenina's M.I.N.D., and Arius laughs wildly in the flames. The inferno that burns the devil will burn Karenina too, down to everything she is.", "cn": "卡列尼娜的意识海中燃起大火，亚利乌斯在烈焰中发出狂妄的笑声，这燃尽魔鬼的烈焰，也将燃尽卡列尼娜的一切。", "sp": "", "sec": "42-25 But the Sea Runs Deep", "hit": "rages"}], "gen": true}, {"cn": "酸洗池", "en": "pickling tank", "cat": "shop", "note": "原表 picking tub", "ex": [], "gen": false}, {"cn": "砂", "en": "sand/grit", "cat": "shop", "note": "", "ex": [{"en": "Scattered across the sand lie metal bones and desiccated flesh. The crystal fragments catch the final threads of daylight that pierce the sea.", "cn": "金属骸骨与萎缩的血肉横斜在沙滩上，嶙峋的晶片上反射着穿透海面的最后一点天光。", "sp": "", "sec": "42-5 Winding Waves", "hit": "sand"}, {"en": "All unfolds as expected, aside from the small irritation of sand biting into his skin.", "cn": "一切都很顺利，除了那硌住掌心的砂砾令人不适。", "sp": "", "sec": "42-5 Winding Waves", "hit": "sand"}, {"en": "The sand burns hot under the sun. When the wind rises, the gold and orange and white grains all sing together. They move like silk. No paint ever made could match it.", "cn": "砂砾被阳光晒得滚烫烫的，风来的时候，金黄的、橙红的和白色的沙子会发出很美妙的声音。它们像丝绸一样流动，什么调色盘都复现不了那种美丽。", "sp": "Lumi", "sec": "42-17 We, the Drowned", "hit": "sand"}], "gen": true}, {"cn": "脱脂", "en": "degreasing", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "锤子", "en": "hammer", "cat": "shop", "note": "", "ex": [{"en": "A plume of dark crimson spray shoots upward. As its tail hammers the waves, the beast accelerates sharply, charging toward the dam.", "cn": "暗红色的泉柱高高喷出，这怪兽的尾鳍猛地拍击海面，速度骤然加快，朝着大坝的方向疾驰而去。", "sp": "", "sec": "42-2 A White-Hot Soul", "hit": "hammers"}, {"en": "Karenina's heart hammers in her chest. Perhaps it is the anchor drawing near.", "cn": "卡列尼娜的心狂跳起来，或许是因为那正在接近的船锚武器。", "sp": "", "sec": "42-14 Folded Course", "hit": "hammers"}, {"en": "Beyond the reach of the lighthouse beam lies an endless dark. Waves surge out of that unseen blackness and hammer the shore without pause.", "cn": "灯塔的光笼罩范围之外，是无穷的黑暗。潮水从黑暗中不知何处奔来，无穷无尽地拍打着海岸。", "sp": "", "sec": "42-18 New World Never Was", "hit": "hammer"}], "gen": true}, {"cn": "除油", "en": "oil removing", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "铲刀", "en": "scraper", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "化学清洗", "en": "chemical cleaning", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "水泥", "en": "cement", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "去油剂", "en": "detergent", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "平方米", "en": "square meter", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "锈", "en": "rusting", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "冰冻", "en": "freeze", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "返锈", "en": "rerusting", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "搅拌", "en": "agitation", "cat": "shop", "note": "", "ex": [{"en": "He needs everything to move. More agitation, more surging, more forward momentum.", "cn": "他需要一切都动起来，需要更多躁动、更多的奔涌、更多的前进。", "sp": "", "sec": "42-18 New World Never Was", "hit": "agitation"}], "gen": true}, {"cn": "点蚀", "en": "pitting", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "搅拌器", "en": "agitator/mixer", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "麻点/点蚀", "en": "pock marks", "cat": "shop", "note": "原表 pocking", "ex": [], "gen": false}, {"cn": "喷漆泵", "en": "spray pump", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "锌盐", "en": "zinc salt/white dust", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "喷枪", "en": "spray gun", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "喷溅麻点", "en": "spatter", "cat": "shop", "note": "原表 spatting", "ex": [{"en": "Against his will, his fingertips drive into the pale clam flesh. Viscous juice spatters across his cheek, and a single golden pearl is wrenched loose.", "cn": "手指尖不受控制地插入白色的蚌肉中，黏腻的汁液溅到了亚利乌斯的面颊上，一颗金色的珍珠被挖了出来。", "sp": "", "sec": "42-2 A White-Hot Soul", "hit": "spatters"}], "gen": true}, {"cn": "枪嘴", "en": "spray nozzle", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "熔块/金属渣", "en": "regulus", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "刷子", "en": "brush", "cat": "shop", "note": "", "ex": [{"en": "A vast shape heaves upward where the sky meets the sea, and something deep in her memory brushes softly against the present.", "cn": "海平线上跃起一个巨大的身影，记忆深处却有什么东西被轻轻触碰了一下。", "sp": "", "sec": "42-3 Song of the Whale", "hit": "brushes"}, {"en": "On the girl's cheek, the tears she could not cry as a baby finally fall, and a pair of thin, weathered hands brushes them gently away.", "cn": "少女的脸颊之上，那幼时没能落下的眼泪，现在被一双枯瘦粗糙的手拭去。", "sp": "", "sec": "42-10 Balloons, Sea Light, and Red Hair", "hit": "brushes"}, {"en": "The sea lies eerily still. Overhead, dark clouds sag so low they nearly brush the mast tops, a heavy lid of silence before the coming storm.", "cn": "海面呈现出一种不正常的平静，天空中乌云压得很低，几乎贴着桅杆的顶端，这是风暴来临前的重压。", "sp": "", "sec": "42-13 Anchoring Life's Error", "hit": "brush"}], "gen": true}, {"cn": "飞溅", "en": "spattering", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "滚刷", "en": "roller", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "灰尘", "en": "dust", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "高架车", "en": "cherry picker", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "粉尘", "en": "ash", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "砂斗", "en": "container", "cat": "shop", "note": "", "ex": [{"en": "By the time he raised his head, Cordelia was beyond the rows of containers, her figure dissolving into an indistinct shape far off.", "cn": "抬头看去时，柯黛已经走过码头的集装箱，留下一个模糊不清的背影。", "sp": "", "sec": "42-2 A White-Hot Soul", "hit": "containers"}, {"en": "At the edge of a container's shadow, Cordelia looked up at the crane's boom, suspended high and swaying faintly, as unsteady as her own thoughts.", "cn": "柯黛站在集装箱阴影的边缘，目光越过起重机的吊臂，那吊臂悬得很高，有些摇摇欲坠，就像她此刻的心情。", "sp": "", "sec": "42-2 A White-Hot Soul", "hit": "container"}, {"en": "He ought to have gone back to his room and slept. But he pulled a container into place and sat down where he could watch over the dead and the sea.", "cn": "他应该回到自己的房间去，好好休息一下。但他只是拖来了集装箱，坐在一个能看到他们，也能看到海面的地方。", "sp": "", "sec": "42-12 The Reasonless Law of Birth", "hit": "container"}], "gen": true}, {"cn": "喷砂", "en": "sand blasting", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "门机", "en": "gantry crane", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "扫喷砂", "en": "sand sweeping", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "汽车吊", "en": "truck crane", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "点喷砂", "en": "spot blasting", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "叉车", "en": "fork lifter", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "湿喷砂", "en": "wet blasting", "cat": "shop", "note": "", "ex": [], "gen": false}, {"cn": "口罩", "en": "mask", "cat": "shop", "note": "", "ex": [{"en": "The infected cargo ship Golden Apple wore no mask over its hostility, and the crew of the Karenin did not waver. Commander Gunnar gave the order to sink her immediately.", "cn": "那艘被感染的金苹果号货轮没有掩饰恶意的伪装，卡列宁号上的众人并未迟疑，贡纳尔长官迅速下达了击沉的指令。", "sp": "", "sec": "42-7 What the Seagull Carried", "hit": "mask"}, {"en": "Gunnar came in through the rear entrance, alone. A gas mask covered his face, w , "ex": [], "gen": false}, {"cn": "风力", "en": "wind force", "cat": "coating", "note": "", "ex": [], "gen": false}, {"cn": "自然干燥", "en": "air drying", "cat": "coating", "note": "原表 natural seasoning", "ex": [], "gen": false}, {"cn": "绝缘", "en": "insulation", "cat": "coating", "note": "", "ex": [], "gen": false}, {"cn": "筛网", "en": "sieve", "cat": "coating", "note": "", "ex": [], "gen": false}, {"cn": "牺牲阳极", "en": "sacrificial anode", "cat": "coating", "note": "", "ex": [], "gen": false}, {"cn": "阳极保护", "en": "anode shield", "cat": "coating", "note": "", "ex": [], "gen": false}, {"cn": "阴极保护", "en": "cathodic protection", "cat": "coating", "note": "", "ex": [], "gen": false}, {"cn": "慢挥发溶剂", "en": "slow-evaporating", "cat": "coating", "note": "", "ex": [], "gen": false}, {"cn": "稀料", "en": "thinner", "cat": "coating", "note": "", "ex": [{"en": "In this endless loop of coming and going, life grows thinner, quietly slipping away one by one.", "cn": "生命就在这循环往复的来去中，渐渐稀疏，陆续消逝。", "sp": "", "sec": "42-1 Tide and Sound", "hit": "thinner"}, {"en": "The stream of data feeding into the Sefirah grows thinner by the moment.", "cn": "涌入质点的数据正在变少。", "sp": "", "sec": "42-18 New World Never Was", "hit": "thinner"}, {"en": "(It isn't that the pain has grown thinner. It's that the one holding it, me... is becoming something wider.)", "cn": "（那一刻不是痛苦本身变轻了，而是接纳痛苦的我……正变得广袤而辽阔。）", "sp": "Cordelia", "sec": "42-21 Trivial Yet Precious Things", "hit": "thinner"}], "gen": true}, {"cn": "溶剂", "en": "solvent", "cat": "coating", "note": "", "ex": [], "gen": false}, {"cn": "油漆配套", "en": "paint scheme", "cat": "coating", "note": "", "ex": [], "gen": false}, {"cn": "指触干", "en": "dry to touch", "cat": "coating", "note": "", "ex": [], "gen": false}, {"cn": "硬干", "en": "hard dry", "cat": "coating", "note": "", "ex": [], "gen": false}, {"cn": "涂布率", "en": "coverage", "cat": "coating", "note": "", "ex": [{"en": "You have entered the designated mission area. The Balder has reached the Jormungandr node coverage zone.", "cn": "您已进入本次任务区域，巴德尔号已航行至耶梦加得节点覆盖区域。", "sp": "", "sec": "42-6 Noise Adrift", "hit": "coverage"}, {"en": "The cable-laying crew comes aboard Fenrir to change the repeaters, check the protocol coverage, and lay the fallen to rest.", "cn": "布缆小队的人都登上了芬里尔节点，更换中继器，确认协议覆盖，以及为亡故者收敛遗体。", "sp": "", "sec": "42-12 The Reasonless Law of Birth", "hit": "coverage"}, {"en": "You have entered the designated mission area. The cable layer has reached the Jormungandr node coverage zone.", "cn": "您已进入本次任务区域，布缆船已航行至耶梦加得节点覆盖区域。", "sp": "Sea Chart Alert", "sec": "42-12 The Reasonless Law of Birth", "hit": "coverage"}], "gen": true}, {"cn": "复涂间隔", "en": "recoating interval", "cat": "coating", "note": "", "ex": [], "gen": false}, {"cn": "露点", "en": "dew point", "cat": "coating", "note": "", "ex": [], "gen": false}, {"cn": "湿度", "en": "humidity", "cat": "coating", "note": "", "ex": [{"en": "I can adjust temperature, humidity, and lighting to optimal levels for human rest.", "cn": "我可以为您将温度、湿度，光照，都调节至适宜人类休息的数值范围。", "sp": "", "sec": "42-21 Trivial Yet Precious Things", "hit": "humidity"}], "gen": false}, {"cn": "氧气", "en": "oxygen", "cat": "coating", "note": "", "ex": [{"en": "Remaining power, oxygen levels, dive depth... all nominal... It's operational!", "cn": "剩余能源、舱内氧含量、下潜深度……一切正常……可以使用！", "sp": "Cordelia", "sec": "42-21 Trivial Yet Precious Things", "hit": "oxygen"}], "gen": false}, {"cn": "渗漏", "en": "leakage", "cat": "coating", "note": "", "ex": [], "gen": false}, {"cn": "求救信号（无线电）", "en": "Mayday", "cat": "ch42", "note": "", "ex": [{"en": "Mayday. Our hull is listing fifteen degrees now...", "cn": "Mayday，我们的船体已经倾斜十五度……", "sp": "Feeble Male Voice", "sec": "42-1 Tide and Sound", "hit": "Mayday"}], "gen": false}, {"cn": "海底光缆", "en": "subsea fiber-optic cable", "cat": "ch42", "note": "", "ex": [], "gen": false}, {"cn": "海床", "en": "seabed", "cat": "ch42", "note": "", "ex": [{"en": "Inside one of them rested a faulty first-generation repeater, just hauled up from the seabed.", "cn": "隔离箱中存放的，是一台刚从海底打捞上来的故障初代中继器。", "sp": "", "sec": "42-6 Noise Adrift", "hit": "seabed"}, {"en": "The most straightforward approach was to salvage an intact first-generation quantum repeater from the seabed and run a direct comparison.", "cn": "最直接的办法，是从海底打捞一台完好的初代量子中继器进行比对核查。", "sp": "", "sec": "42-6 Noise Adrift", "hit": "seabed"}, {"en": "Every operation currently unfolding on these waters was doing nothing more than driving that long-hidden danger deeper into the seabed.", "cn": "眼下这片大海上的所有行动，都不过是在亲手将那潜伏已久的危险一节一节地钉进海里。", "sp": "", "sec": "42-6 Noise Adrift", "hit": "seabed"}], "gen": false}, {"cn": "进水", "en": "flooding", "cat": "ch42", "note": "", "ex": [{"en": "Distress signals around Rainbow Bridge are flooding in. Several times past any record we have. Sir, we're almost out of time.", "cn": "彩虹桥基地辐射范围内的海域，海难求援信息已经超出历史记录的几倍，要来不及了，长官。", "sp": "", "sec": "42-5 Winding Waves", "hit": "flooding"}, {"en": "Given how fast the hull had been flooding, the Fortuna had likely gone under already.", "cn": "按船舱进水的速度，现在幸运女神号应该都要沉了。", "sp": "", "sec": "42-7 What the Seagull Carried", "hit": "flooding"}, {"en": "Abandon the mission, and every scrap of data flooding through those cables will feed the Sefirah I carry, without end.", "cn": "放弃这个任务，光缆中奔流的所有信息数据，会源源不绝地供养我体内的质点。", "sp": "", "sec": "42-14 Folded Course", "hit": "flooding"}], "gen": false}, {"cn": "救生艇", "en": "lifeboat", "cat": "ch42", "note": "", "ex": [{"en": "Guided by Larsen's details, Karenina discovers the dilapidated dock tucked beneath the lighthouse, where a handful of lifeboats rest, long abandoned.", "cn": "根据拉森所说的信息，卡列尼娜找到了塔底那个破败的船坞，那里还有几艘救生小艇。", "sp": "", "sec": "42-17 We, the Drowned", "hit": "lifeboats"}, {"en": "Karenina pilots the lifeboat and ferries everyone from the doomed half-ship to Mirage Island.", "cn": "卡列尼娜驾驶着救生艇将众人从那即将沉没的半艘船中转移到了蜃岛之上。", "sp": "", "sec": "42-17 We, the Drowned", "hit": "lifeboat"}, {"en": "The lifeboat, now serving as their makeshift cable layer, pulls slowly away from the shore and glides out onto the grey-white sea.", "cn": "临时充当布缆船的救生艇缓缓驶离岸边，朝着灰白色海面上驶去。", "sp": "", "sec": "42-17 We, the Drowned", "hit": "lifeboat"}], "gen": false}, {"cn": "浮标", "en": "buoy", "cat": "ch42", "note": "", "ex": [{"en": "On paper, they were headed to the North Atlantic Weather Buoy Maintenance Station. In reality, they were bound for a covert military outpost at an undisclosed location.", "cn": "这批补给的目的地，对外宣称是“北大西洋气象浮标维护站”，但真正卸货的坐标大概是某个秘密的军事哨港基地。", "sp": "", "sec": "42-2 A White-Hot Soul", "hit": "Buoy"}, {"en": "The current veers by a fraction of a degree. Surface warmth rises at a crawl too slow for human satellites to catch, too faint for buoys to cry warning.", "cn": "洋流的角度偏移了零点几度，表层水温以肉眼不可察觉的速率缓慢爬升，这个变化太过微小，人类的气象卫星无法捕捉，浮标探测器不会报警。", "sp": "", "sec": "42-5 Winding Waves", "hit": "buoys"}, {"en": "Her consciousness begins to drift, a buoy severed from its anchor, lost in an ocean of red.", "cn": "意识开始漂浮，像是被剪断了锚绳的浮标，迷失在一片深红之中。", "sp": "", "sec": "42-13 Anchoring Life's Error", "hit": "buoy"}], "gen": false}, {"cn": "声呐", "en": "sonar", "cat": "ch42", "note": "", "ex": [{"en": "You are near the stern, inside the sonar control room.", "cn": "自己此时正在靠近船尾的声呐控制室。", "sp": "", "sec": "42-13 Anchoring Life's Error", "hit": "sonar"}, {"en": "A Construct can cross that distance with ease, and you were stationed near the sonar control room at the stern anyway. The seconds stretch generously before you.", "cn": "对于构造体来说，撤离到布缆船船尾并非难事，而自己原本就在靠近船尾的声呐控制室，时间也足够充裕。", "sp": "", "sec": "42-13 Anchoring Life's Error", "hit": "sonar"}, {"en": "This is Cordelia to all hands. Everyone in the living quarters, evacuate to the sonar control room at the stern! The ship is breaking apart!", "cn": "这里是柯黛里娅，全船广播——所有在生活舱的人立刻向船尾声呐控制室撤离！船体在撕裂！", "sp": "Cordelia", "sec": "42-20 Drowned in the Wind", "hit": "sonar"}], "gen": false}, {"cn": "节（航速）", "en": "knot", "cat": "ch42", "note": "", "ex": [{"en": "Captain, current speed 13.2 knots. Fuel reserves holding steady.", "cn": "报告船长，当前航速13.2节，续航燃油余量充足。", "sp": "Lieutenant Junior Grade Lyndae", "sec": "42-5 Winding Waves", "hit": "knots"}, {"en": "The vessel was the Golden Apple, sailing from the Arctic Route Union, now creeping at three knots through a scattered cortege of limbs.", "cn": "这是来自北极航线的金苹果号，被残肢断臂簇拥着，以大约三节的航速缓慢飘荡在海面上。", "sp": "", "sec": "42-7 What the Seagull Carried", "hit": "knots"}, {"en": "Contact APL-307. Bearing one-zero-seven. Speed thirty-five knots, closing. Issue warning?", "cn": "目标APL-307，方位一〇七，速度三十五节，正在接近，是否发送警告？", "sp": "Frigga (Central AI)", "sec": "42-7 What the Seagull Carried", "hit": "knots"}], "gen": false}, {"cn": "水压", "en": "water pressure", "cat": "ch42", "note": "", "ex": [], "gen": false}, {"cn": "潮汐", "en": "tide", "cat": "ch42", "note": "", "ex": [{"en": "We need to finish calibrating these cable layers before the tide turns. After that... we head out and restore the entire Atlantic fiber-optic network.", "cn": "我们要赶在涨潮前对这几艘布缆船做最后的调试，然后……出发抢修整个大西洋海域的光缆系统。", "sp": "Mara", "sec": "42-3 Song of the Whale", "hit": "tide"}, {"en": "the tide hums low in its throat.", "cn": "潮汐的哼唱从喉间溢出", "sp": "", "sec": "42-4 Homeward Current", "hit": "tide"}, {"en": "Schools of fish boiled to the sea surface, their silver backs flashing under the sun like a tide of shattered mirrors, flinging themselves shoreward in blind panic.", "cn": "大量鱼群翻涌到海面，银色的脊背在日光的直射下闪烁成一片流动的碎镜，不顾一切地向岸上跳跃。", "sp": "", "sec": "42-5 Winding Waves", "hit": "tide"}], "gen": false}, {"cn": "洋流", "en": "current", "cat": "ch42", "note": "", "ex": [{"en": "The current veers by a fraction of a degree. Surface warmth rises at a crawl too slow for human satellites to catch, too faint for buoys to cry warning.", "cn": "洋流的角度偏移了零点几度，表层水温以肉眼不可察觉的速率缓慢爬升，这个变化太过微小，人类的气象卫星无法捕捉，浮标探测器不会报警。", "sp": "", "sec": "42-5 Winding Waves", "hit": "current"}, {"en": "The Current Hydrodynamic Energy System. Top-level alert, straight from Fenrir. The hub's lost control.", "cn": "洋流水力控制枢纽！这是由芬里尔节点直接发布的全海域最高级警报，洋流水力控制枢纽失控了。", "sp": "Cordelia", "sec": "42-5 Winding Waves", "hit": "Current"}, {"en": "The Transatlantic monitoring network. Every red device here is directly linked to the Current Hydrodynamic Energy System.", "cn": "环大西洋海洋监测总网，这些飘红的设备都直接负责洋流水力控制枢纽。", "sp": "Cordelia", "sec": "42-5 Winding Waves", "hit": "Current"}], "gen": false}, {"cn": "中继", "en": "relay", "cat": "ch42", "note": "", "ex": [{"en": "I can build a protocol relay. Strip out anything that might be hiding a backdoor and block it at the software level. But the current protocol still can't be trusted...", "cn": "我可以改装一个协议中转器，剥离任何可能隐藏后门的协议指令，直接从软件层面堵截……但是，目前的协议依旧是不可靠的……", "sp": "Karenina", "sec": "42-6 Noise Adrift", "hit": "relay"}, {"en": "We open all Rainbow Bridge comm channels. We become a relay station at sea.", "cn": "开放彩虹桥全部的通讯权限，我们来充当海上的临时中转站。", "sp": "", "sec": "42-8 When the Fairy Tale Sank", "hit": "relay"}, {"en": "It has more expansion ports than anything else we have. It's practically built to be adapted into a relay.", "cn": "它的拓展端口非常多，很适合改造成为中间件。", "sp": "", "sec": "42-16 Requiem", "hit": "relay"}], "gen": false}, {"cn": "频率", "en": "frequency", "cat": "ch42", "note": "", "ex": [{"en": "She glanced down at her terminal again. Still no word from White Stork. She let out a breath and switched to a separate encrypted frequency.", "cn": "她的目光又落回到手中终端上，白鹳依然没有任何消息，柯黛里娅叹了口气，接通了另一个加密频道。", "sp": "", "sec": "42-2 A White-Hot Soul", "hit": "frequency"}, {"en": "The frequency slips under every bioacoustic filter the engineers have set. The instruments detect nothing.", "cn": "它的频率低于一切常规的海洋生物声学监测阈值，人类工程师所有监听设备无法察觉到它的存在。", "sp": "", "sec": "42-3 Song of the Whale", "hit": "frequency"}, {"en": "The frequency scrapes through her M.I.N.D. like a needle dragged raw across glass, every vibration sickening and wrong.", "cn": "那频率像用极细的针尖毛糙地划过她的意识海，如划过玻璃发出的声音一般恶心。", "sp": "", "sec": "42-3 Song of the Whale", "hit": "frequency"}], "gen": false}, {"cn": "检查", "en": "inspection", "cat": "ch42", "note": "", "ex": [{"en": "Pre-inspection parameters for the cable layer's deep-sea mode pending calibration. Bio-environmental monitoring underway. Captain Karenina... ma'am!", "cn": "布缆船深海模式的预检参数待校准，生物环境监测已展开，卡列尼娜队、卡列尼娜船长！", "sp": "", "sec": "42-3 Song of the Whale", "hit": "inspection"}, {"en": "Then at least run one more check first. Exhaust every option you've got. You're an engineer. You know that inspections...", "cn": "至少再检查一下，做完所有努力。你是工程师，难道还不清楚设备检——", "sp": "Karenina", "sec": "42-4 Homeward Current", "hit": "inspections"}, {"en": "Yes, we ran each one through the new automated inspection protocol after removal.", "cn": "是的，换下来后我们都按新的自动检测规范过了一遍。", "sp": "Shanonie", "sec": "42-5 Winding Waves", "hit": "inspection"}], "gen": false}, {"cn": "锈蚀的", "en": "corroded", "cat": "ch42", "note": "", "ex": [], "gen": false}, {"cn": "救生筏", "en": "life raft", "cat": "ch42", "note": "", "ex": [{"en": "We've abandoned ship. Six of us on the life raft. It's so cold... P-please, just please, somebody save us...", "cn": "我们已经弃船，救生筏上有六个人，这里很冷，请、请救救我们——", "sp": "Sobbing Female Voice", "sec": "42-1 Tide and Sound", "hit": "life raft"}, {"en": "Port-side life rafts! Check them again!", "cn": "左舷的救生筏再检查一遍！", "sp": "Lieutenant Junior Grade Onni", "sec": "42-5 Winding Waves", "hit": "life rafts"}], "gen": false}, {"cn": "舰桥", "en": "bridge", "cat": "ch42", "note": "", "ex": [{"en": "You came to wait for Lucia and Lee? It's pretty windy out here. Go wait in the crew quarters or up on the bridge. They'll come find you the second they're back.", "cn": "在等露西亚他们？这里风很大的，你进兵舱或者驾驶台等着，他们一回来一定会马上去找你。", "sp": "Karenina", "sec": "42-4 Homeward Current", "hit": "bridge"}, {"en": "With Lucia and Lee safely back aboard, the group gathers around the bridge's small tactical table.", "cn": "露西亚与里已经顺利返航，几人正围在驾驶台的小型战术桌边。", "sp": "", "sec": "42-4 Homeward Current", "hit": "bridge"}, {"en": "On the bridge, Captain Gunnar stood before the window, a stream of reports flowing into his ear through the comm channel one after another.", "cn": "驾驶台，贡纳尔上校站在舷窗前，一声声回报通过通讯频道汇聚到他的耳中。", "sp": "", "sec": "42-5 Winding Waves", "hit": "bridge"}], "gen": false}, {"cn": "倾斜（船体）", "en": "list", "cat": "ch42", "note": "", "ex": [{"en": "Mayday. Our hull is listing fifteen degrees now...", "cn": "Mayday，我们的船体已经倾斜十五度……", "sp": "Feeble Male Voice", "sec": "42-1 Tide and Sound", "hit": "listing"}], "gen": false}];
const QUIZ=[
{q:"Before blasting or painting, the steel surface temperature must be at least ___ above the dew point.",qc:"喷砂或涂装前，钢板温度至少要高于露点多少？",o:["3 °C (5 °F)","1 °C (2 °F)","10 °C (18 °F)","Equal to the dew point is fine"],a:0,e:"行业通用规则：钢板温度 ≥ 露点 + 3 °C，防止表面结露（condensation）。相对湿度通常还要 ≤ 85%，以涂料说明书 PDS 为准。",r:"AMPP CIP L1 · ISO 8502-4"},
{q:"Air 20 °C, RH 85 %, dew point ≈ 17.4 °C, steel 19 °C. Can you apply the coating?",qc:"气温20°C，湿度85%，露点约17.4°C，钢板19°C，能涂吗？",o:["No — steel is only 1.6 °C above the dew point","Yes — the steel is warmer than the air","Yes — RH is not above 85 %","Only with brush application"],a:0,e:"19 − 17.4 = 1.6 °C，不到 3 °C 的余量。应开除湿机（dehumidifier）或等待，复测后再施工。",r:"Dew point check"},
{q:"ISO 8501-1 Sa 2½ is closest to which SSPC / NACE standard?",qc:"ISO 8501-1 的 Sa 2½ 对应哪个 SSPC/NACE 标准？",o:["SSPC-SP 10 / NACE No. 2 Near-White Blast","SSPC-SP 5 / NACE No. 1 White Metal Blast","SSPC-SP 6 / NACE No. 3 Commercial Blast","SSPC-SP 7 / NACE No. 4 Brush-Off Blast"],a:0,e:"Sa 3 ≈ SP 5 白级；Sa 2½ ≈ SP 10 近白级；Sa 2 ≈ SP 6 商业级；Sa 1 ≈ SP 7 清扫级。压载舱 PSPC 要求 Sa 2½。",r:"ISO 8501-1 · SSPC/NACE joint standards"},
{q:"What must be done BEFORE abrasive blasting if the steel is contaminated with oil and grease?",qc:"钢板有油污时，喷砂前必须先做什么？",o:["SSPC-SP 1 Solvent Cleaning","SSPC-SP 3 Power Tool Cleaning","Apply the shop primer","Wet the surface with seawater"],a:0,e:"SP 1 溶剂清洗（脱脂 degreasing）要先做，否则喷砂会把油污打进粗糙面里。",r:"SSPC-SP 1"},
{q:"Replica tape (Testex) gives a micrometer reading of 115 µm. What is the surface profile?",qc:"复制胶带测得千分尺读数115 µm，实际粗糙度是多少？",o:["About 64 µm","115 µm","About 165 µm","About 58 µm"],a:0,e:"读数里含 50.8 µm（2 mils）不可压缩的聚酯膜，要减掉：115 − 51 ≈ 64 µm。",r:"ASTM D4417 Method C"},
{q:"Under the IMO PSPC, the required surface profile for ballast tanks is:",qc:"IMO PSPC 对压载舱要求的粗糙度范围是？",o:["30–75 µm","10–25 µm","75–125 µm","Any profile is acceptable"],a:0,e:"PSPC：Sa 2½，粗糙度 30–75 µm，水溶性盐 ≤ 50 mg/m²（NaCl），灰尘等级 ≤ 1。",r:"IMO MSC.215(82) PSPC"},
{q:"What is the PSPC limit for soluble salts on the blasted surface?",qc:"PSPC 规定喷砂后表面可溶性盐上限是？",o:["50 mg/m² NaCl equivalent","500 mg/m²","5 mg/m²","No limit"],a:0,e:"盐分会造成渗透起泡（osmotic blistering）。超标就用高压淡水冲洗（HPFW）后复测。",r:"PSPC · ISO 8502-6 / 8502-9"},
{q:"Which method is used to collect soluble salts from the surface for a conductivity test?",qc:"用什么方法收集表面可溶性盐做电导率测试？",o:["Bresle patch (ISO 8502-6)","Cross-cut tape test","Wet sponge holiday test","Psychrometer"],a:0,e:"Bresle 贴片注入去离子水，抽回后测电导率（ISO 8502-9），换算成 mg/m²。",r:"ISO 8502-6 / 8502-9"},
{q:"Which test evaluates dust on a blast-cleaned surface?",qc:"哪项测试评估喷砂后表面的灰尘？",o:["Pressure-sensitive tape test, ISO 8502-3","ISO 8501-1 photographs","ASTM D4541 pull-off","Comparator disc"],a:0,e:"胶带粘取后对照图片评灰尘数量等级（1–5）和颗粒大小等级。PSPC 要求数量等级 ≤ 1。",r:"ISO 8502-3"},
{q:"Specified DFT 125 µm, volume solids 50 %, no thinner. Target WFT?",qc:"规定干膜125 µm，体积固含量50%，不加稀释剂，湿膜应是多少？",o:["250 µm","62 µm","175 µm","125 µm"],a:0,e:"WFT = DFT × 100 / VS% = 125 × 100 / 50 = 250 µm。",r:"WFT formula"},
{q:"DFT 150 µm, volume solids 60 %, thinned 10 %. Target WFT?",qc:"干膜150 µm，固含量60%，加10%稀释剂，湿膜应是多少？",o:["275 µm","250 µm","225 µm","300 µm"],a:0,e:"WFT = DFT × (100 + 稀释%) / VS% = 150 × 110 / 60 = 275 µm。",r:"WFT formula with thinner"},
{q:"Volume solids 60 %, DFT 200 µm. Theoretical spreading rate?",qc:"固含量60%，干膜200 µm，理论涂布率是多少？",o:["3.0 m²/L","12 m²/L","0.3 m²/L","6.0 m²/L"],a:0,e:"理论涂布率 = VS% × 10 / DFT(µm) = 60 × 10 / 200 = 3 m²/L。实际用量还要加损耗系数（loss factor）。",r:"Coverage formula"},
{q:"Under SSPC-PA 2, one 'spot measurement' is:",qc:"SSPC-PA 2 中，一个“点测量”(spot measurement) 是？",o:["The average of at least 3 gauge readings within a 4 cm (1.5 in) circle","One single gauge reading","The average of a whole tank","10 readings along a weld"],a:0,e:"每 10 m²（100 ft²）测 5 个点，每点 ≥ 3 次读数取平均。单个读数低于下限可以接受，点平均才是判定依据。",r:"SSPC-PA 2"},
{q:"How many spot measurements does SSPC-PA 2 require per 10 m² (100 ft²) area?",qc:"SSPC-PA 2 规定每10 m²测几个点？",o:["5","1","3","20"],a:0,e:"5 个点；面积大时按规则抽查若干个 10 m² 区域。",r:"SSPC-PA 2"},
{q:"The PSPC '90/10 rule' for DFT means:",qc:"PSPC 的“90/10 规则”是指？",o:["90 % of readings ≥ NDFT, and the remaining 10 % ≥ 0.9 × NDFT","90 % of the tank must be coated","10 % of readings may be zero","DFT may exceed NDFT by 90 %"],a:0,e:"NDFT = 名义干膜厚度。压载舱环氧体系 NDFT 一般为 320 µm。ISO 19840 用的是另一套 80/20 规则。",r:"PSPC"},
{q:"What is the usual nominal DFT (NDFT) for a PSPC ballast tank epoxy system?",qc:"PSPC 压载舱环氧体系通常的名义干膜厚度是？",o:["320 µm","80 µm","1000 µm","150 µm"],a:0,e:"典型做法：两道环氧，加两道预涂（stripe coat），总 NDFT 320 µm。",r:"PSPC"},
{q:"Why is a stripe coat applied?",qc:"为什么要做预涂（stripe coat）？",o:["To build film thickness on edges, welds, corners and scallops","To change the colour","To speed up curing","To replace the primer"],a:0,e:"喷涂时边缘、焊缝处膜会被拉薄。PSPC 要求做两道预涂（第二道在焊缝上可视情况减少）。",r:"PSPC · good practice"},
{q:"Which holiday detector is used on a 300 µm epoxy lining?",qc:"300 µm 环氧涂层用哪种漏涂检测仪？",o:["Low-voltage wet sponge detector","High-voltage spark tester at 15 kV","Magnetic pull-off gauge","Replica tape"],a:0,e:"约 500 µm（20 mils）以下用低压湿海绵法（≤ 90 V）；更厚的涂层用高压电火花法，电压按膜厚计算。",r:"NACE SP0188 · ASTM D5162"},
{q:"The most likely cause of sagging (runs) is:",qc:"流挂（sagging）最可能的原因是？",o:["Excessive wet film thickness or over-thinning","Steel too cold","Low humidity","Insufficient profile"],a:0,e:"一次喷太厚、稀释过多、喷枪离太近都会流挂。用湿膜卡（wet film gauge）边喷边测。",r:"Coating defects"},
{q:"A greasy white film appears on an epoxy cured in cold, humid conditions. It is:",qc:"环氧在低温高湿下固化，表面出现油腻的白膜，这是？",o:["Amine blush","Chalking","Mill scale","Orange peel"],a:0,e:"胺霜（amine blush）会影响层间附着力，复涂前要用清水加洗刷去除。",r:"Epoxy defects"},
{q:"Osmotic blistering under a coating is most often caused by:",qc:"涂层下面出现渗透起泡，最常见的原因是？",o:["Soluble salts left on the steel","Too much UV","Thick topcoat colour","Using a roller"],a:0,e:"盐分吸水形成渗透压把涂层顶起来，所以喷砂后一定要测盐。",r:"Coating defects"},
{q:"Dry spray (rough, powdery surface) is usually caused by:",qc:"干喷（表面粗糙、像粉）通常是什么原因？",o:["Gun held too far away, wind, or solvent evaporating too fast","Too much thinner","Steel below dew point","Film too thick"],a:0,e:"漆雾在到达表面前溶剂已挥发。调整喷距、换慢干稀释剂、做好挡风。",r:"Coating defects"},
{q:"Orange peel is mainly the result of:",qc:"桔皮（orange peel）主要是因为？",o:["Poor atomization or viscosity too high","Soluble salts","Low film thickness","Cathodic protection"],a:0,e:"雾化不好、粘度太高，漆膜流平（leveling）不了。",r:"Coating defects"},
{q:"Mud cracking is typical of:",qc:"龟裂（mud cracking）常见于？",o:["Inorganic zinc applied too thick","Alkyd paint applied thin","Brush marks","Galvanized steel"],a:0,e:"无机富锌、水性涂料超厚时容易像干泥地一样开裂。按说明书控制最大干膜。",r:"Coating defects"},
{q:"A self-polishing copolymer (SPC) antifouling works by:",qc:"自抛光（SPC）防污漆的原理是？",o:["Slowly hydrolysing at the surface, releasing biocide and staying smooth","Staying hard and never changing","Electrically repelling barnacles","Reflecting sunlight"],a:0,e:"表面水解层（hydrolyze layer）随航行逐渐抛光，持续释放防污剂，防止藤壶、海藻、管虫附着。",r:"Marine antifouling"},
{q:"Sacrificial anodes on a ship's hull are usually made of:",qc:"船体上的牺牲阳极通常用什么材料？",o:["Zinc or aluminium alloy","Copper","Stainless steel","Lead"],a:0,e:"比钢更活泼的金属先被腐蚀，保护船体，这是阴极保护（cathodic protection）。另一种做法是外加电流（ICCP）。",r:"Cathodic protection"},
{q:"Which standard covers pull-off adhesion testing?",qc:"拉开法附着力测试是哪个标准？",o:["ASTM D4541 / ISO 4624","ASTM D4417","SSPC-PA 2","ISO 8501-1"],a:0,e:"粘上铝锭（dolly），固化后拉开，读 MPa 并记录破坏形式（附着破坏/内聚破坏）。",r:"ASTM D4541"},
{q:"ASTM D3359 Method A (X-cut) is used for coatings:",qc:"ASTM D3359 方法 A（X 划格）用于多厚的涂层？",o:["Thicker than 125 µm (5 mils)","Thinner than 50 µm","Only wet paint","Only galvanizing"],a:0,e:"方法 B（百格）用于 125 µm 以下的薄涂层。",r:"ASTM D3359"},
{q:"'Induction time' (熟化) for a two-pack epoxy means:",qc:"双组分环氧的“熟化时间”(induction time) 是指？",o:["Waiting time after mixing before application","Time until the pot gels","Time between coats","Drying time before handling"],a:0,e:"混合后静置让基料和固化剂预反应。pot life（适用期）是混合后可用的最长时间。",r:"Product data sheet"},
{q:"The maximum recoating interval has been exceeded. Typical action?",qc:"超过了最大复涂间隔，通常怎么处理？",o:["Abrade or sweep-blast the surface per the manufacturer, then recoat","Apply a thicker coat","Just clean with water and recoat","Nothing — intervals are only advice"],a:0,e:"超过复涂间隔层间附着力会变差，要按涂料商的要求打毛或扫砂（sweep blasting）。",r:"Product data sheet"},
{q:"A 'hold point' in an inspection and test plan (ITP) means:",qc:"检验试验计划（ITP）里的 hold point 是什么意思？",o:["Work cannot proceed until the inspector accepts it","An optional check","A rest break","A point where painting must always stop for the day"],a:0,e:"停止点：检验员签字放行后才能进行下一步，比如喷砂后验收合格才能喷底漆。",r:"Inspector role"},
{q:"Before entering a ballast tank, the first requirement is:",qc:"进压载舱前首先要满足什么？",o:["Gas-free certificate and confined-space entry permit","A full paint scheme","A thickness gauge","High humidity"],a:0,e:"测爆（gas free）、通风、测氧（约 19.5–23.5% O₂）、有人监护，再办进舱许可。",r:"Safety"},
{q:"Before using an electronic DFT gauge each day, you should:",qc:"每天用电子测厚仪前应该做什么？",o:["Verify accuracy on certified coating thickness standards","Shake it","Measure the wet paint","Nothing"],a:0,e:"用标准片（shims / certified standards）做精度验证并记录，必要时按说明书调零调整（adjust）。",r:"SSPC-PA 2 · ASTM D7091"},
{q:"High-pressure fresh water washing (HPFW) before painting mainly removes:",qc:"涂装前高压淡水冲洗（HPFW）主要去除什么？",o:["Soluble salts, mud and loose fouling","Mill scale","Sound old epoxy","Rust pitting"],a:0,e:"进坞后先 HPFW 冲掉盐分、污泥、海生物，再评估锈蚀等级、确定点喷砂（spot blasting）范围。",r:"Dry-dock practice"},
{q:"PSPC requires edges to be:",qc:"PSPC 对边缘处理的要求是？",o:["Rounded to a radius of at least 2 mm, or three-pass grinding","Left sharp","Taped","Painted first with topcoat"],a:0,e:"锐边涂层薄、易早期失效。倒角 R ≥ 2 mm 或至少三道打磨。",r:"PSPC"},
{q:"Which document gives health and safety information for a paint?",qc:"哪份文件提供油漆的健康安全信息？",o:["Safety Data Sheet (SDS)","Product Data Sheet (PDS)","Daily inspection report","Paint scheme"],a:0,e:"PDS 给技术参数（固含量、干燥时间、复涂间隔）；SDS 给危险性、防护用品、急救。",r:"Documentation"}
];

const DRILLS=[
{t:"露点不够，暂停施工",s:"船东代表催你开工。钢板温度只比露点高 1.5°C。用英语告诉他现在不能涂，并给出解决办法。",k:[["dew point"],["steel temperature","steel temp","surface temperature"],["three degrees","3 degrees","3 °c","three °c"],["dehumidifier","dehumidification"],["check again","re-check","recheck","measure again"]],m:"We can't start painting yet. The steel temperature is only one point five degrees above the dew point, and we need at least three degrees. Please run the dehumidifier, and we will check again in one hour."},
{t:"喷砂验收报告",s:"压载舱喷砂完成：Sa 2½，粗糙度 55 µm，盐分 30 mg/m²，灰尘等级 1。用英语口头汇报并给出结论。",k:[["sa two and a half","sa 2.5","two and a half","sa 2½"],["profile"],["microns","micron","µm"],["soluble salt","salt","salts"],["dust"],["accept","accepted","acceptable","pass"]],m:"The ballast tank has been blasted to Sa two and a half. The surface profile is fifty-five microns, soluble salts are thirty milligrams per square meter, and the dust rating is one. The surface is accepted, and you can start the primer."},
{t:"指出流挂和漏涂",s:"你在甲板上发现流挂和几处漏涂。用英语告诉工头问题和整改要求。",k:[["sagging","sags","runs","running"],["holidays","holiday","missed areas"],["touch-up","touch up","repair"],["wet film","film thickness","thickness"],["before","next coat"]],m:"I found sagging on the bulwark and several holidays near the hatch coaming. Please brush out the sags, touch up the holidays, and check the wet film thickness before the next coat."},
{t:"解释为什么要预涂",s:"新来的油漆工问为什么要做 stripe coat。用英语简单解释。",k:[["edges","edge"],["welds","weld seams","weld"],["thin","thinner film","low thickness"],["corrosion","rust","fail"],["brush","by brush"]],m:"We apply a stripe coat by brush on edges, welds and corners, because the spray film is always thinner there. Without it, those areas start to rust first."},
{t:"干膜不足",s:"你测量了一个压载舱，部分读数低于 320 µm 的 NDFT，不满足 90/10 规则。用英语汇报并要求处理。",k:[["dry film thickness","dft"],["below","under","low"],["ninety ten","90/10","90 10","ninety slash ten"],["additional coat","extra coat","another coat"],["re-measure","measure again","remeasure","check again"]],m:"Several dry film thickness readings in the tank are below the nominal three hundred and twenty microns, so the ninety-ten rule is not met. Please apply an additional coat on the low areas, and I will measure again after it cures."},
{t:"进舱前安全确认",s:"工人准备进污油水舱打磨。用英语说明进舱前必须完成的安全步骤。",k:[["gas free","gas-free"],["permit"],["oxygen"],["ventilation","ventilate"],["standby","watchman","attendant"]],m:"Nobody enters the slop tank until we have a gas free certificate and an entry permit. Check the oxygen level, keep the ventilation running, and keep a standby man at the access hole."},
{t:"复涂间隔超了",s:"上一道环氧涂完已经 40 天，超过了说明书的最大复涂间隔。用英语告诉施工方怎么处理。",k:[["recoating interval","recoat interval","overcoating interval"],["exceeded","over","passed"],["sweep","abrade","sanding","roughen"],["data sheet","manufacturer","pds"],["clean","wash"]],m:"The maximum recoating interval has been exceeded. Before the next coat, please clean the surface and sweep blast or abrade it, as the manufacturer's data sheet requires."},
{t:"进坞检查船底",s:"船进坞后船底长满藤壶和海藻。用英语描述状况并安排第一步。",k:[["barnacles","barnacle"],["fouling","sea weed","seaweed","weed"],["antifouling","anti-fouling"],["hpfw","fresh water","high pressure"],["hull","bottom"]],m:"The hull bottom is heavily covered with barnacles and sea weed, so the old antifouling is no longer working. First, wash the whole bottom with high pressure fresh water, then we will survey the rusting and decide on spot blasting."},
{t:"42章：发出 Mayday",s:"像 42-1 里的求救那样：你的船进水、倾斜 15 度、船上 34 人。用英语发出完整的 Mayday 呼叫。",k:[["mayday"],["position","north atlantic","latitude"],["flooding","taking water","water"],["listing","list"],["persons","people","on board","crew"]],m:"Mayday, Mayday, Mayday. This is the Rommel. Our position is the North Atlantic, sea area four. We are flooding and listing fifteen degrees. Thirty-four persons on board. Request immediate assistance."},
{t:"42章：海底光缆巡检",s:"卡列尼娜要修复海底光缆。假装你是她的检测员，用英语报告中继器的腐蚀情况和涂层修复建议。",k:[["subsea","cable","fiber"],["repeater","relay"],["corrosion","corroded","rust"],["coating","coat","epoxy"],["cathodic protection","anode","anodes"]],m:"The subsea cable repeater we hauled up is badly corroded at the housing joint. I recommend we remove the rust to bare metal, apply a high-build epoxy coating, and replace the sacrificial anodes before it goes back to the seabed."}
];

{k:"role",lv:1,t:"检测员角色与文件",en:"Inspector's role & documents",p:[

{k:"corr",lv:1,t:"腐蚀基础",en:"Corrosion basics",p:[

 "腐蚀发生在<b>阳极</b>（金属失去电子）；涂层的作用是隔绝电解质（barrier）、抑制（inhibitive）或牺牲保护（sacrificial，如富锌）。",

{k:"coat",lv:1,t:"涂料组成与固化",en:"Coating composition & curing",p:[
 "涂料 = <b>binder/resin 基料</b>（成膜，决定性能）+ <b>pigment 颜料</b> + <b>solvent 溶剂</b> + additives 助剂。",
 "固化方式：<b>溶剂挥发</b>（氯化橡胶、乙烯类，可被自身溶剂重新溶解）、<b>氧化</b>（醇酸 alkyd）、<b>化学反应</b>（环氧 epoxy、聚氨酯 polyurethane，双组分）、<b>凝聚</b>（水性乳胶 latex）。",
 "双组分：按比例混合 → 熟化（induction time）→ 在适用期（pot life）内用完。",
 "体积固含量（volume solids）决定湿膜与干膜的换算和涂布率。"]},
{k:"prep",lv:1,t:"表面处理与清洁度",en:"Surface preparation",p:[

 "<b>SP 5 = Sa 3 白级；SP 10 = Sa 2½ 近白级；SP 6 = Sa 2 商业级；SP 7 = Sa 1 清扫级</b>；手工 SP 2 / 动力 SP 3；SP 11 动力工具到裸金属（要有粗糙度）。",
 "ISO 8501-1 原始锈蚀等级 <b>A、B、C、D</b>（D 有点蚀），配合照片判定。",
 "粗糙度 ASTM D4417：A 比较板、B 深度千分表、C 复制胶带（减 50.8 µm）。",
 "压缩空气洁净度：<b>吸墨纸试验 ASTM D4285</b>（看有无油、水）；可溶盐 ISO 8502-6/-9；灰尘 ISO 8502-3。"]},
{k:"env",lv:1,t:"环境条件",en:"Environmental conditions",p:[
 "测量：<b>干湿球湿度计（sling psychrometer）</b>或电子湿度计 → 气温、湿度、露点；表面温度计测钢板温度。",
 "通用规则：<b>钢板温度 ≥ 露点 + 3 °C（5 °F）</b>，RH 一般 ≤ 85%，具体以 PDS 为准。",
 "湿球温度低于干球温度，两者差值（wet-bulb depression）越大，空气越干。",

{k:"app",lv:1,t:"施工方法",en:"Application methods",p:[
 "刷涂（brush）适合预涂和小面积；辊涂（roller）适合大平面；<b>空气喷涂</b>雾化好、损耗大；<b>无气喷涂（airless）</b>靠高压通过喷嘴雾化，效率高。",
 "喷枪垂直于表面，距离稳定，每道<b>重叠 50%</b>。",
 "混合要充分搅拌（agitation）；稀释剂只按说明书比例加。",
 "<b>无气喷涂高压可造成注射伤</b>，严禁对人、喷嘴护罩不能拆。"]},
{k:"instr",lv:1,t:"非破坏性仪器",en:"Non-destructive instruments",p:[
 "湿膜卡（WFT comb）：喷完<b>立即</b>垂直压在表面读数。",
 "干膜测厚仪：<b>Type 1 磁性拉脱式</b>（如香蕉表）、<b>Type 2 电子式</b>；使用前用标准片做精度验证。",
 "Type 1 要测<b>基底读数（BMR）</b>并从读数中扣除（按 SSPC-PA 2）。",

 "低压湿海绵漏点仪：约 500 µm 以下涂层，≤ 90 V。"]},
{k:"defect",lv:1,t:"漆病识别",en:"Coating defects",p:[

 "起泡 blistering（盐分、溶剂夹带）；胺霜 amine blush（环氧低温高湿）；粉化 chalking（紫外老化）。",
 "龟裂 mud cracking（富锌超厚）；剥落 peeling / 层间分离 delamination（附着失效、超复涂间隔）。"]},
{k:"safety",lv:1,t:"安全",en:"Safety",p:[

 "喷砂、喷漆按 SDS 配戴呼吸防护（respirator）、手套、护目镜。",
 "设备维修前上锁挂牌（lockout / tagout）。"]},
{k:"calc",lv:1,t:"计算",en:"Calculations",p:[

 "<b>理论涂布率 m²/L = VS% × 10 ÷ DFT(µm)</b>；实际用量 = 面积 ÷ 理论涂布率 ÷ (1 − 损耗%)。",
 "单位：1 mil = 25.4 µm；°F = °C × 1.8 + 32。"]},
{k:"l2cp",lv:2,t:"阴极保护与涂层",en:"Cathodic protection",p:[
 "原理：让被保护结构整体成为<b>阴极</b>。<b>牺牲阳极</b>（锌、铝、镁）或<b>外加电流（ICCP）</b>。",
 "涂层 + 阴极保护配合：涂层减少裸露面积，阴极保护保护漏涂点。",

{k:"l2chem",lv:2,t:"高性能涂料",en:"High-performance coatings",p:[

 "<b>无机富锌（乙基硅酸盐）</b>靠吸收空气湿气固化，太干固化慢；固化程度用 <b>ASTM D4752 MEK 擦拭</b>检查。",

{k:"l2wj",lv:2,t:"水喷射与特殊表面处理",en:"Waterjetting & special prep",p:[

{k:"l2destr",lv:2,t:"破坏性测试",en:"Destructive tests",p:[

 "<b>划格法</b> ASTM D3359：A 法 X 划（> 125 µm），B 法百格（≤ 125 µm）。",
 "<b>涂层剖面仪（Tooke gauge / paint inspection gauge）</b>：按固定角度切口，用放大镜读出每一层厚度，适用于任何底材。",
 "铅笔硬度 ASTM D3363；溶剂擦拭 ASTM D4752（无机富锌）、ASTM D5402。",
 "破坏性测试做完要按规范<b>修补测试点</b>。"]},
{k:"l2holiday",lv:2,t:"漏点检测",en:"Holiday detection",p:[
 "<b>低压湿海绵</b>：较薄涂层（约 500 µm / 20 mils 以下）。<b>高压电火花</b>：厚涂层。",

 "检测前涂层要充分固化，表面干燥清洁；接地可靠。",

{k:"l2conc",lv:2,t:"混凝土涂装",en:"Concrete coating",p:[

 "含水率：<b>塑料薄膜法 ASTM D4263</b>（定性）、氯化钙法 ASTM F1869、相对湿度探头 ASTM F2170。",
 "表面处理：去除<b>浮浆（laitance）</b>，喷砂/打磨，粗糙度按 ICRI CSP 等级（SSPC-SP 13 / NACE No. 6）。",

{k:"l2spec",lv:2,t:"特种涂层与船舶 PSPC",en:"Special coatings & PSPC",p:[
 "<b>IMO PSPC 压载舱</b>：Sa 2½、粗糙度 30–75 µm、盐分 ≤ 50 mg/m² NaCl、灰尘等级 ≤ 1、边缘 R ≥ 2 mm、两道预涂、NDFT 320 µm、<b>90/10 规则</b>。",
 "<b>FBE 熔结环氧</b>：管道工厂涂装，粉末加热熔融固化。",
 "<b>热喷涂（TSMC，喷锌/铝）</b>：要求很高的清洁度和粗糙度，常加封闭漆。",

{k:"l2fail",lv:2,t:"失效分析",en:"Failure analysis",p:[

 "层间剥离常见原因：超复涂间隔、胺霜、层间污染。",
