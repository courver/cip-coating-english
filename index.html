{m:"prep",q:"ISO 8501-1 rust grade D describes steel that is:",qc:"ISO 8501-1 锈蚀等级 D 指钢板：",o:["Fully rusted with visible pitting","Covered with intact mill scale","Rusting with mill scale flaking","Slightly rusted"],a:0,e:"A：完整氧化皮；B：开始生锈、氧化皮剥落；C：氧化皮已锈掉、少量点蚀；D：全面锈蚀、可见点蚀。",r:"ISO 8501-1"},
{m:"prep",q:"Which test checks compressed air for oil and water before blasting?",qc:"喷砂前检查压缩空气是否含油含水用什么试验？",o:["Blotter test (ASTM D4285)","Bresle patch","Tape test","Sling psychrometer"],a:0,e:"用白色吸墨纸对着出气口吹约 1 分钟，看有无油渍或水迹。",r:"ASTM D4285"},
{m:"prep",q:"SSPC-SP 11 differs from SSPC-SP 3 because SP 11:",qc:"SSPC-SP 11 和 SP 3 的区别是 SP 11：",o:["Requires bare metal and a surface profile","Uses hand tools only","Allows tight mill scale","Is a blast standard"],a:0,e:"SP 11 动力工具清理到裸金属并要有粗糙度（不少于 25 µm）；SP 3 允许残留附着牢固的氧化皮、锈和旧漆。",r:"SSPC-SP 11"},
{m:"prep",q:"Steel shot (round) compared with steel grit (angular) produces a profile that is:",qc:"钢丸（圆形）和钢砂（棱角）相比，产生的粗糙度：",o:["More rounded (peened) and less angular","More angular","Deeper and sharper","Exactly the same"],a:0,e:"钢丸偏锤击、轮廓圆钝；钢砂切削、棱角分明，附着更好。很多规范要求棱角粗糙度（angular profile）。",r:"Abrasives"},
{m:"env",q:"With a sling psychrometer, the wet-bulb temperature is normally:",qc:"用干湿球湿度计时，湿球温度通常：",o:["Lower than the dry-bulb temperature","Higher than the dry bulb","Equal to the steel temperature","Equal to the dew point always"],a:0,e:"湿球纱布的水蒸发吸热，所以读数更低；只有 RH 100% 时才相等。差值越大空气越干。",r:"Sling psychrometer"},
{m:"env",q:"When should environmental readings be taken?",qc:"环境读数应该什么时候测？",o:["Before and during work, at the work location, and when conditions change","Once a week","Only in the office","Only after painting"],a:0,e:"测量要在施工部位，开工前、施工中定时、天气变化时加测，并记录在报告里。",r:"Environmental conditions"},
{m:"env",q:"The dew point is the temperature at which:",qc:"露点是指：",o:["Air becomes saturated and moisture condenses","Paint starts to cure","Steel starts to rust","Solvent boils"],a:0,e:"钢板温度低于或接近露点，表面会凝结看不见的水膜，导致附着失效和闪锈。",r:"Dew point"},
{m:"app",q:"For good spray technique, each pass should overlap the previous one by about:",qc:"喷涂时每一道与上一道应重叠约：",o:["50 %","10 %","90 %","0 %"],a:0,e:"喷枪垂直于表面、速度和距离稳定、重叠 50%，膜厚才均匀。",r:"Spray technique"},
{m:"app",q:"Airless spray atomizes paint by:",qc:"无气喷涂靠什么雾化？",o:["Forcing paint at high pressure through a small tip","Mixing it with compressed air at the gun","Heating it","Electrostatic charge only"],a:0,e:"无气喷涂高压（常见十几到二十几 MPa）通过喷嘴雾化，效率高、漆雾少，但高压有注射伤风险。",r:"Application methods"},
{m:"app",q:"Paint has settled in the can. Before application you should:",qc:"油漆罐底有沉淀，施工前应该：",o:["Mix (agitate) thoroughly until uniform","Pour off the top liquid only","Add extra thinner","Heat the can with a torch"],a:0,e:"充分搅拌到均匀，否则颜料（含锌粉）分布不均，影响性能和膜厚。",r:"Mixing"},
{m:"instr",q:"When should a wet film comb be used?",qc:"湿膜卡应在什么时候测？",o:["Immediately after application, pressed perpendicular to the surface","After the paint is hard dry","Before mixing","Only on cured coatings"],a:0,e:"溶剂挥发很快，要喷完马上测；读取最后一个沾漆齿与第一个未沾漆齿之间。",r:"WFT gauge"},
{m:"instr",q:"With a Type 1 (magnetic pull-off) gauge, the base metal reading (BMR) is:",qc:"Type 1 磁性测厚仪的基底读数（BMR）要：",o:["Measured on the blasted steel and subtracted from coating readings","Added to the readings","Ignored","Used only on concrete"],a:0,e:"粗糙的喷砂面会让仪器读出一个“假厚度”，按 SSPC-PA 2 要测出并扣除。",r:"SSPC-PA 2"},
{m:"instr",q:"A Type 2 DFT gauge is:",qc:"Type 2 干膜测厚仪是：",o:["An electronic gauge (magnetic induction or eddy current)","A magnetic pull-off gauge","A wet film comb","A destructive cutting gauge"],a:0,e:"Type 1 机械磁性拉脱式；Type 2 电子式（磁感应测钢上涂层，涡流测有色金属上涂层）。",r:"ASTM D7091"},
{m:"defect",q:"Small holes going through the film, often caused by solvent or air escaping, are called:",qc:"贯穿漆膜的小孔，常由溶剂或空气逸出造成，叫：",o:["Pinholes","Holidays","Chalking","Sags"],a:0,e:"针孔 pinholes；在混凝土或富锌层上喷涂时尤其常见，可用雾喷（mist coat）减少。",r:"Coating defects"},
{m:"defect",q:"Cratering (small round depressions) is usually caused by:",qc:"缩孔（圆形小凹坑）通常由什么引起？",o:["Surface contamination such as oil or silicone","Too low humidity","Correct film thickness","Using a brush"],a:0,e:"油、硅等污染使涂料表面张力不均，形成缩孔。要找到污染源并清洁。",r:"Coating defects"},
{m:"defect",q:"Intercoat delamination between two epoxy coats is most likely caused by:",qc:"两道环氧之间层间剥离最可能的原因：",o:["Exceeding the maximum recoat interval or amine blush between coats","Correct stripe coating","Low DFT on the primer","Using a WFT comb"],a:0,e:"超过最大复涂间隔表面太硬太光滑，或层间有胺霜、污染，下一道就附着不上。",r:"Coating defects"},
{m:"safety",q:"The main hazard of airless spray equipment to the operator is:",qc:"无气喷涂设备对操作者最主要的危险是：",o:["Injection injury from the high-pressure stream","Low noise","Cold paint","Slow application"],a:0,e:"高压漆流可以射穿皮肤，看起来伤口很小但非常危险，必须立即就医。不能用手试喷、不能拆护罩。",r:"Safety"},
{m:"safety",q:"Before maintaining a blasting machine, the energy source must be:",qc:"维修喷砂机之前，能量源必须：",o:["Isolated with lockout/tagout","Left running","Turned to low pressure","Covered with a rag"],a:0,e:"上锁挂牌（LOTO），释放残余压力后才能维修。",r:"Safety"},
{m:"calc",q:"Convert 5 mils to microns.",qc:"5 mils 等于多少微米？",o:["127 µm","50 µm","254 µm","5 µm"],a:0,e:"1 mil = 25.4 µm，5 × 25.4 = 127 µm。CIP 题目常混用英制和公制。",r:"Units"},
{m:"calc",q:"Area 2,000 m², DFT 125 µm, VS 50 %, loss factor 30 %. How much paint is needed?",qc:"面积 2000 m²，干膜 125 µm，固含量 50%，损耗 30%，需要多少升？",o:["About 714 L","500 L","350 L","About 1,000 L"],a:0,e:"理论涂布率 = 50×10/125 = 4 m²/L；理论用量 2000/4 = 500 L；含损耗 500/(1−0.3) ≈ 714 L。",r:"Paint quantity"},
{m:"l2cp",q:"Impressed current cathodic protection (ICCP) uses:",qc:"外加电流阴极保护（ICCP）用的是：",o:["An external DC power source and inert anodes","Zinc anodes only","Thicker paint","AC current from the ship"],a:0,e:"整流器提供直流电，通过惰性/辅助阳极给结构提供保护电流；牺牲阳极则靠金属自身电位差。",r:"Cathodic protection"},
{m:"l2cp",q:"Excessive cathodic protection can cause:",qc:"阴极保护过强可能造成：",o:["Cathodic disbondment of the coating","Better adhesion","Chalking","Mud cracking"],a:0,e:"阴极反应生成碱和氢，会把涂层从钢面顶开，所以船底涂层要求耐阴极剥离。",r:"Cathodic protection"},
{m:"l2cp",q:"Why are coatings and cathodic protection used together on a hull?",qc:"船体为什么同时用涂层和阴极保护？",o:["The coating reduces the bare area, and CP protects the holidays and damage","CP replaces the need for coating","Coating makes CP stronger","They cannot be used together"],a:0,e:"涂层承担主要保护，阴极保护保护破损和漏涂点；涂层越好，需要的保护电流越小。",r:"Cathodic protection"},
{m:"l2chem",q:"An ethyl silicate inorganic zinc primer cures by:",qc:"乙基硅酸盐无机富锌底漆靠什么固化？",o:["Absorbing moisture from the air (hydrolysis)","Oxidation","Heat only","Solvent evaporation only"],a:0,e:"需要一定湿度才能固化，太干燥时可以喷水雾辅助（按说明书）。",r:"Inorganic zinc"},
{m:"l2chem",q:"Which test checks the cure of an ethyl silicate inorganic zinc?",qc:"检查乙基硅酸盐无机富锌固化程度用：",o:["ASTM D4752 MEK solvent rub","ASTM D4417","ISO 8501-1","Wet sponge test"],a:0,e:"用 MEK 浸湿的棉布来回擦 50 次，按掉锌程度评级。",r:"ASTM D4752"},
{m:"l2chem",q:"A polyurethane topcoat is often applied over epoxy because:",qc:"为什么常在环氧上面加聚氨酯面漆？",o:["Polyurethane has good UV and gloss retention; epoxy chalks in sunlight","Polyurethane is cheaper than epoxy","Epoxy cannot be overcoated","Polyurethane is a primer"],a:0,e:"环氧耐化学、附着好但不耐紫外；聚氨酯耐候保光。聚氨酯含异氰酸酯，喷涂时要做好呼吸防护。",r:"Coating systems"},
{m:"l2wj",q:"Waterjetting a previously blasted steel surface will:",qc:"对以前喷砂过的钢面进行水喷射，会：",o:["Expose the existing profile but not create a new one","Create a new angular profile","Remove all profile","Galvanize it"],a:0,e:"水喷射只清除涂层、锈和盐，不能产生新的粗糙度。新钢板没有粗糙度时不能只靠水喷射。",r:"SSPC/NACE WJ"},
{m:"l2wj",q:"After waterjetting, flash rust is graded as:",qc:"水喷射后的闪锈分级为：",o:["Light, Moderate, Heavy","Sa 1, Sa 2, Sa 3","A, B, C, D","Type 1, Type 2"],a:0,e:"闪锈 L/M/H 三级，规范规定允许的等级，超过要处理后再涂。",r:"Flash rust"},
{m:"l2wj",q:"One main advantage of waterjetting over dry abrasive blasting is:",qc:"水喷射相比干喷砂的主要优点之一：",o:["It removes soluble salts more effectively and makes little dust","It creates a deeper profile","It needs no water","It works faster on new steel"],a:0,e:"水能溶解冲走盐分，粉尘少；缺点是会闪锈，不能产生粗糙度。",r:"Waterjetting"},
{m:"l2destr",q:"A Tooke gauge (paint inspection gauge) measures thickness by:",qc:"涂层剖面仪（Tooke gauge）怎么测厚度？",o:["Cutting a V-groove at a known angle and reading each layer under magnification","Magnetic induction","Ultrasonic waves","Weighing the paint"],a:0,e:"破坏性方法，能看到每一层的厚度，适用于任何底材（包括混凝土、塑料）。测完要修补。",r:"Destructive tests"},
{m:"l2destr",q:"In a pull-off test, the break happens entirely within the topcoat layer. This is:",qc:"拉开试验中，断裂完全发生在面漆层内部，这是：",o:["Cohesive failure of the topcoat","Adhesive failure at the steel","Glue failure","Intercoat failure"],a:0,e:"内聚破坏：涂层内部强度先失效；附着破坏：在界面上分开；胶粘剂破坏：试验无效或说明附着力高于读数。",r:"ASTM D4541"},
{m:"l2destr",q:"After a destructive test on a coated structure, the inspector must ensure:",qc:"做完破坏性测试后，检测员必须确保：",o:["The test areas are repaired as the specification requires","Nothing — test spots are acceptable","Only photos are taken","The coating is stripped"],a:0,e:"测试点是人为造成的缺陷，要按规范修补，并记录位置。",r:"Destructive tests"},
{m:"l2holiday",q:"Setting a high-voltage holiday detector far above the required voltage may:",qc:"高压漏点仪电压设得远高于要求，可能会：",o:["Damage (burn through) sound coating","Miss all holidays","Improve adhesion","Cure the coating faster"],a:0,e:"电压按膜厚设定（NACE SP0188），过高会击穿合格涂层，制造新缺陷。",r:"NACE SP0188"},
{m:"l2holiday",q:"Before holiday testing, the coating must be:",qc:"漏点检测前涂层必须：",o:["Sufficiently cured, clean and dry","Still wet","Covered with water","Blasted again"],a:0,e:"未固化的涂层含溶剂，会导电或被击穿，结果不可靠。",r:"Holiday detection"},
{m:"l2conc",q:"A simple qualitative test for moisture in concrete is:",qc:"检测混凝土含水的一种简单定性方法是：",o:["Plastic sheet test, ASTM D4263","Bresle patch","Blotter test","Tooke gauge"],a:0,e:"贴一块塑料薄膜，16 小时后看下面或表面是否有水珠。定量可用氯化钙法 F1869 或 RH 探头 F2170。",r:"ASTM D4263"},
{m:"l2conc",q:"Laitance on a concrete surface should be:",qc:"混凝土表面的浮浆应该：",o:["Removed before coating","Coated over directly","Wetted","Painted with alkyd"],a:0,e:"浮浆是表面弱层，不去除涂层会连同浮浆一起剥落。用喷砂、打磨或酸蚀去除。",r:"Concrete prep"},
{m:"l2conc",q:"To reduce outgassing pinholes when coating concrete, apply the coating:",qc:"为减少混凝土排气针孔，应在什么时候涂？",o:["When the concrete temperature is falling","At the hottest time of day","When the concrete is warming up","In direct midday sun"],a:0,e:"混凝土升温时孔隙里的空气膨胀外逸形成针孔；降温时空气收缩，反而把涂料吸入。",r:"Concrete coating"},
{m:"l2spec",q:"Fusion-bonded epoxy (FBE) is applied as:",qc:"熔结环氧（FBE）以什么形式施工？",o:["A powder onto preheated steel","A two-pack liquid by roller","A water-based emulsion","A tape wrap"],a:0,e:"FBE 多用于管道工厂涂装，钢管预热后喷粉，粉末熔融流平并固化。",r:"Pipeline coatings"},
{m:"l2spec",q:"Thermal spray aluminium (TSA) coatings require:",qc:"热喷铝（TSA）涂层要求：",o:["Very clean steel with an angular profile, often followed by a sealer","No surface preparation","Application over wet steel","Only hand-tool cleaning"],a:0,e:"热喷涂靠机械咬合，要求高清洁度（常为白级/近白级）和棱角粗糙度，之后加封闭漆。",r:"Thermal spray"},
{m:"l2fail",q:"Coating comes off cleanly, exposing bare steel with no coating left on it. This is:",qc:"涂层剥下后钢面干干净净、没有残留漆膜，这是：",o:["Adhesive failure at the steel/coating interface","Cohesive failure","Intercoat failure","Chalking"],a:0,e:"附着破坏发生在钢/涂层界面，通常指向表面处理问题：污染、盐分、粗糙度不足、结露。",r:"Failure analysis"},
{m:"l2fail",q:"Rust spreading under the coating from a damaged spot is called:",qc:"锈蚀从破损点向涂层下蔓延叫：",o:["Undercutting (undercreep)","Orange peel","Bleeding","Floating"],a:0,e:"undercutting / undercreep，常发生在边缘和破损处，富锌底漆能明显减少。",r:"Failure analysis"},
{m:"l2fail",q:"What is the FIRST step in a coating failure investigation?",qc:"涂层失效调查的第一步是：",o:["Collect the records and history (spec, batch, environment, DFT)","Strip the coating","Repaint immediately","Blame the contractor"],a:0,e:"先收集资料（规范、批号、施工记录、环境读数），再现场观察、测试、取样分析，最后下结论。",r:"Failure analysis"}
];

{sec:"42-1",title:"潮与声",en:"Tide and Sound",depth:0,place:"军部通讯中心 · 北大西洋",nodes:[
 {t:"n",cn:"红潮在大西洋上蔓延，环大西洋的光缆枢纽被一个接一个破坏。军部 80% 的地表流量都压在海底光缆上。"},
 {t:"q",sec:"42-1",en:"Someone's gotta go in there. Right into the Red Tide and fix the undersea cables, or we're not going anywhere.",cn:"需要有人冒险去红潮中维修海底光缆，才有可能进行下一步。"},
 {t:"n",cn:"你是灰鸦小队的指挥官。这一次，你还多了一张证书：AMPP CIP 涂层检测员。布缆船出海前的涂装验收，要你签字。"},
 {t:"n",cn:"通讯频道里，忽然涌进无数求救声。"},
 {t:"q",sec:"42-1",sp:"System Broadcast",spc:"系统播报",en:"Mayday! Mayday! Mayday!",cn:"Mayday，Mayday，Mayday——"},
 {t:"q",sec:"42-1",sp:"Feeble Male Voice",spc:"虚弱的男声",en:"Mayday. Our hull is listing fifteen degrees now...",cn:"Mayday，我们的船体已经倾斜十五度……"},
 {t:"mcq",q:"In 'Our hull is listing fifteen degrees', what is happening to the ship?",qc:"“hull is listing” 是什么情况？",o:["The hull is tilting to one side","The hull is on fire","The hull is being repainted","The hull is moored"],e:"list 作船舶用语是“横倾、倾斜”。hull = 船体。这是海上遇险报告的标准说法。"},
 {t:"speak",cn:"先学会海上最重要的一句话。跟着读出这条求救报告。",en:"Mayday. Our hull is listing fifteen degrees now."}
]},
{sec:"42-3",title:"鲸鱼的诗歌",en:"Song of the Whale",depth:0,place:"珀港造船厂 · 三号泊位",nodes:[
 {t:"q",sec:"42-3",sp:"Mission Briefing",spc:"任务播报",en:"Proceed to Berth 3, Port Podesta Shipyard. Board the Balder and set course along the Mid-Atlantic Ridge route toward the Atlantic Eye.",cn:"请赶赴珀港造船厂三号泊位，登入巴德尔号离港，沿大西洋中脊航线向大西洋之眼推进。"},
 {t:"mcq",q:"'Berth 3' in the briefing is…",qc:"任务播报里的 Berth 3 是？",o:["A ship's mooring place in port","A cabin bed number","A crane","A paint store"],term:"berth",e:"berth = 泊位。船台是 slipway / building berth，船坞是 dock。"},
 {t:"q",sec:"42-3",en:"The ship sinks into the dock as the outer gates yawn wide. Salt water pours in, rising past the Balder's painted designation, and the vessel shifts, cradled by the flood.",cn:"船体在船坞中缓慢下沉，巨型闸门开启后，海水从外港涌入，漫过巴德尔号的舷号，船体在水的托举下轻微晃动着。"},
 {t:"n",cn:"出坞灌水之前，船厂还差最后一道工序：水线区的补漆。工头拿着记录板跑过来。"},
 {...FM,t:"l",en:"Commander, we want to touch up the boottop before the dock floods. Can we start spraying now?",cn:"指挥官，灌坞之前我们想把水线区补一下漆，现在能开喷吗？"},
 {t:"mcq",q:"Which part of the hull is the 'boottop'?",qc:"boottop 指船体哪个部位？",o:["The area between the light and deep load lines","The flat bottom","The funnel","The cargo hold"],term:"boottop",e:"boottop = 水线区，干湿交替、最容易腐蚀，所以常常单独配套涂层。"},
 {t:"dew",T:12,RH:88,St:10.5,cn:"你掏出湿度计和钢板温度计，读数如下。现在能开喷吗？"},
 {t:"speak",cn:"用英语告诉工头结论。",en:"We have to hold. The steel is too close to the dew point."},
 {t:"n",cn:"两小时后除湿机把湿度压了下来，补漆完成。巴德尔号与织女星号先后离港。老研究员玛拉站在甲板上。"},
 {t:"q",sec:"42-3",en:"Mara takes a moment. Her gaze travels back across the port, skimming the Balder's hull, until it rests on the open water, endless and gray-blue in the distance.",cn:"玛拉没有立刻回答，她重新看向港口，越过巴德尔号的船身，更远处是那灰蓝色的辽阔海面。"},
 {t:"q",sec:"42-3",en:"A whale cries out across the water.",cn:"一声鲸鸣从海平线的方向传来。"},
 {t:"q",sec:"42-3",...K,en:"The whales... that sound... something's wrong with it, it's not... agh...",cn:"鲸鸣……那种声音……不对劲，不对——啊……"},
 {t:"n",cn:"机械鲸鱼从船的右侧浮出水面。你必须马上在频道里报出方位。"},
 {t:"mcq",q:"The mechanical whale surfaces on the RIGHT side of the ship (facing the bow). You call:",qc:"机械鲸鱼从船的右侧（面向船首）出现，你应该喊：",o:["Starboard side!","Port side!","Astern!","Bow thruster!"],term:"starboard-side",hp:12,e:"面向船首，右舷 starboard，左舷 port side，船首 bow，船尾 stern。"}
]},
{sec:"42-4",title:"反身洄游",en:"Homeward Current",depth:20,place:"巴德尔号 · 船壳外侧",nodes:[
 {t:"n",cn:"卡列尼娜的新机体完成激活，灰鸦小队击退了鲸群。战斗结束后，你挂着安全绳下到船壳外侧，检查鲸鱼撞击的部位。"},
 {...K,t:"l",en:"Commander, how bad is it? Can the Balder keep going?",cn:"指挥官，情况怎么样？巴德尔号还能继续走吗？"},
 {t:"mcq",q:"Along the waterline you see small dome-shaped bubbles under the paint film. This defect is:",qc:"水线附近漆膜下面鼓起很多小圆泡，这是：",o:["Blistering","Chalking","Orange peel","Sagging"],term:"blistering",e:"blistering = 起泡。海水环境里最常见的原因是表面残留盐分造成的渗透起泡。"},
 {t:"mcq",q:"Where the whale hit, the coating is gone and the steel shows small, deep rust holes. This is:",qc:"撞击处涂层没了，钢板上有很多又小又深的锈坑，这是：",o:["Pitting","Mill scale","Leveling","Bleeding"],term:"pitting",e:"pitting = 点蚀。点蚀坑里的盐和锈要彻底清掉，必要时补焊。"},
 {t:"mcq",q:"Near the bow, the paint is coming off in large sheets. This is:",qc:"船首附近漆膜一大片一大片地掉，这是：",o:["Peeling","Pinhole","Floating","Wrinkling"],term:"peeling",e:"peeling = 剥落，通常是附着力（adhesion）失效，比如底材没处理好或超过了复涂间隔。"},
 {t:"choice",cn:"回船上跟卡列尼娜汇报：",o:[
   {en:"It's only paint damage. We can repair it at the next port.",cn:"只是漆面损伤，到下个港口再修。",trust:-5,r:{...K,en:"Only paint? Then why do I hear the hull groaning... Fine. I'll trust you.",cn:"只是漆？那我怎么听到船体在响……好吧，我信你。"}},
   {en:"There's blistering and pitting near the boottop. We need spot blasting and a touch-up before we go deeper.",cn:"水线区有起泡和点蚀，下潜前要点喷砂并补漆。",trust:5,r:{...K,en:"Got it. I'll tell Larsen to prep the blasting gear. Thanks, Commander.",cn:"明白，我让拉森准备喷砂设备。谢啦，指挥官。"}}]},
 {t:"speak",cn:"把专业的那句汇报完整读一遍。",en:"There's blistering and pitting near the boottop. We need spot blasting and a touch-up."},
 {t:"n",cn:"回到舱内，船员们发现桌上多了一个来历不明的盆栽。"},
 {t:"q",sec:"42-4",en:"Feeling the weight of every gaze land on it at once, the potted plant's metal base sprouts several tiny articulated claws.",cn:"察觉到众人的目光齐刷刷地落在自己身上，盆栽的金属底座下突然伸出几只细小的机械关节爪。"},
 {t:"q",sec:"42-4",sp:"Strange Potted Plant",spc:"奇怪的盆栽",en:"Plant the stars, sail the seas, and always find your way. Your potted plant? No. Your precision navigator.",cn:"种下星辰大海，测准经纬方位。你的盆栽？不，还是你的导航仪~"},
 {t:"q",sec:"42-4",...LA,en:"Advertisement. This is a mechanical potted plant. Maritime workers used them to grow whatever plants they liked.",cn:"是广告。这是三十多年前环大西洋流行过一阵的机械盆栽，可以让海面作业人员种点自己喜欢的植物。"}
]},
{sec:"42-6",title:"噪音滑落",en:"Noise Adrift",depth:60,place:"巴德尔号 · 隔离箱实验室",nodes:[
 {t:"q",sec:"42-6",en:"Inside one of them rested a faulty first-generation repeater, just hauled up from the seabed.",cn:"隔离箱中存放的，是一台刚从海底打捞上来的故障初代中继器。"},
 {t:"q",sec:"42-6",...K,en:"You think you can swap in the second-gen quantum repeater and keep the first-gen unit intact while you're at it?",cn:"你能在顺利更换二代量子中继器的前提下，保持一代机的完整吗？"},
 {...LA,t:"l",en:"The housing is covered in oil and marine growth. If we want to keep it as evidence, it needs a new coating first.",cn:"外壳全是油污和海生物。要留作证物，得先重新做防腐涂层。"},
 {t:"mcq",q:"The housing is greasy. What is the FIRST surface preparation step?",qc:"外壳有油污，第一步表面处理是什么？",o:["SSPC-SP 1 Solvent Cleaning","Abrasive blasting to Sa 2½","Apply primer directly","Wire brushing"],term:"degreasing",e:"先 SP 1 溶剂清洗/脱脂，否则喷砂会把油污打进粗糙面里。"},
 {t:"mcq",q:"After blasting, a Bresle patch test shows 80 mg/m² of soluble salts (limit 50). What now?",qc:"喷砂后 Bresle 测得盐分 80 mg/m²（上限 50），怎么办？",o:["Wash with high-pressure fresh water and test again","Accept it and prime","Paint a thicker coat","Heat the steel"],term:"HPFW",e:"超标就 HPFW 高压淡水冲洗后复测，合格再涂。盐分留着会起泡。"},
 {t:"mcq",q:"Replica tape reads 115 µm on the micrometer. What is the surface profile?",qc:"复制胶带千分尺读数 115 µm，实际粗糙度是？",o:["About 64 µm","115 µm","About 165 µm","About 30 µm"],term:"roughness",e:"减去 50.8 µm 的聚酯膜：115 − 51 ≈ 64 µm，在 30–75 µm 范围内。"},
 {t:"n",cn:"处理好的外壳在灯下泛着金属光。卡列尼娜盯着检测报告，又调出了晶体的谱图。"},
 {t:"q",sec:"42-6",en:"The entanglement-source crystal has been doped with minuscule traces of a special isotope, one that does not appear in any known database.",cn:"纠缠源晶体内部被掺入了极为微量的特殊同位素，一种在现有资料库中没有记录的特殊同位素。"},
 {t:"q",sec:"42-6",...K,en:"Then it's settled! I'll knock out these repeater replacements fast, get military comms back up, and deal with everything else after.",cn:"就这么定了！我一鼓作气快点换完中继器，让军情通讯恢复正常，再去考虑其他的东西。"}
]},
{sec:"42-10",title:"气球、海光与红色的发丝",en:"Balloons, Sea Light, and Red Hair",depth:120,place:"芬里尔节点",nodes:[
 {t:"q",sec:"42-10",en:"The operational sectors of Fenrir lie in the low ground, and the Red Tide has already flooded most of them. There is no sign of anyone left.",cn:"芬里尔节点的作业区地势较低，大部分地区已经被红潮淹没，已经没有人迹。"},
 {t:"q",sec:"42-10",en:"Mara has lost track of how long she has been sitting in Fenrir's office.",cn:"玛拉已经在芬里尔节点的办公室坐了不知道多久。"},
 {t:"q",sec:"42-10",sp:"Mara",spc:"玛拉",en:"Your body adapted well to Tantalum-193... but more precisely... to another element inside it. Ytterbium-174...",cn:"你的身体，和钽-193共聚物的适配很好……但准确的说，和共聚物中的另一种元素……镱-174，更加适配……"},
 {t:"q",sec:"42-10",en:"When Karenina walks out of Fenrir, sunset spreads across the water, and even the Red Tide-tainted sea catches the light in shimmers of gold.",cn:"卡列尼娜走出了芬里尔节点，夕照铺满了大海，被红潮污染的大海竟也泛着金光。"},
 {t:"choice",cn:"卡列尼娜一句话也没说。你要对她说：",o:[
   {en:"Take your time. I'm right here.",cn:"慢慢来，我就在这儿。",trust:6,r:{...K,en:"...Just stay a little longer. That's all.",cn:"……再陪我待一会儿，就一会儿。"}},
   {en:"We need to move. The cables won't fix themselves.",cn:"得走了，光缆不会自己修好。",trust:-3,r:{...K,en:"...Right. The mission. I know.",cn:"……对，任务。我知道。"}}]},
 {t:"speak",cn:"把你刚才选的那句话，用自己的声音对她说一遍：",en:"@choice"}
]},
{sec:"42-13",title:"锚定生命之错",en:"Anchoring Life's Error",depth:200,place:"布缆船 · 风暴海域",nodes:[
 {t:"n",cn:"布缆船遭到机械鲸鱼撞击，船体从中间断裂。拉森被浪卷进了海里。"},
 {t:"q",sec:"42-13",en:"In the next heartbeat, a towering wall of water crashes over him.",cn:"下一秒，铺天盖地的浪墙冲向了他。"},
 {t:"q",sec:"42-13",en:"You shelter Rarana close and descend below deck, racing for the engine room as the watertight doors slam down one after another behind you.",cn:"护着拉拉纳下到甲板以下，向动力室奔跑的过程中，路上的水密门也逐个降落。"},
 {t:"mcq",q:"The doors closing behind you are 'watertight doors'. Watertight means:",qc:"watertight door 的 watertight 是：",o:["Water cannot pass through","Full of water","Used for drinking water","Painted white"],term:"watertight",e:"watertight = 水密。舱壁（bulkhead）上的水密门把船分成多个水密舱，一舱进水不至于沉船。"},
 {t:"q",sec:"42-13",...K,en:"Activate the recovery system on the ship. My anchor will track your signal. I'm sending Larsen back first.",cn:"请你在船上开启回收系统，我的船锚会追踪你的定位，先把拉森送回去。"},
 {t:"q",sec:"42-13",...K,en:"Once he's safe, send the anchor back to me.",cn:"等拉森安全了，你再把船锚送回我身边。"},
 {t:"mcq",q:"On a ship, the machine that heaves in the anchor chain is the:",qc:"船上收放锚链的机器是：",o:["Windlass","Winch for cargo","Davit arm","Echo sounder"],term:"windlass",e:"windlass = 锚机。锚链经 hawse pipe（锚链筒）进出，收进 chain locker（锚链舱）。"},
 {t:"q",sec:"42-13",en:"She watches as the anchor carries Larsen back toward the stern, which is almost lost from view. A white trail stretches behind him across the dark sea.",cn:"拉森的身体被拖着向快要飘出视线外的船尾移动，在海面上划出一道白色的水痕。"},
 {t:"speak",cn:"拉森被拉上了船。现在轮到你按下回收键，在频道里喊：",en:"Larsen is safe. Sending the anchor back to you now!"},
 {t:"q",sec:"42-13",en:"With the command confirmed, the anchor launches toward Karenina's position.",cn:"随着确认指令下达，船锚重新发向卡列所在的方向。"}
]},
{sec:"42-16",title:"送灵曲",en:"Requiem",depth:200,place:"彩虹桥军事基地旧址",nodes:[
 {t:"q",sec:"42-16",...K,en:"This is... the Rainbow Bridge Military Base.",cn:"这里是……彩虹桥军事基地。"},
 {t:"q",sec:"42-16",en:"The Rainbow Bridge Military Base looks nothing like what Larsen remembers.",cn:"彩虹桥军事基地已经不再是拉森记忆中的样子。"},
 {t:"q",sec:"42-11",en:"A salt-laden wind, heavy with the scent of rust, swept over the desolate base. Its port saw no more rescue ships.",cn:"咸腥的海风夹杂着铁锈味，掠过孤独的基地——不再有求援的船只驶来。"},
 {t:"q",sec:"42-16",sp:"Frigga (Central AI)",spc:"弗丽嘉·智能中枢",en:"I am Frigga, the central intelligence of Rainbow Bridge Military Base. It is a pleasure to assist you.",cn:"我是彩虹桥军事基地的智能中枢，弗丽嘉，很高兴为您服务。"},
 {t:"n",cn:"你请弗丽嘉调出基地钢结构的状况。二十年没人维护，这里像一本腐蚀教科书。"},
 {t:"mcq",q:"The epoxy on the sun-facing walkway is covered in a loose white powder that rubs off on your glove. This is:",qc:"朝阳面走道上的环氧漆表面有一层白粉，一擦就掉，这是：",o:["Chalking","Blushing","Holidays","Mud cracking"],term:"chalking",e:"chalking = 粉化，环氧在紫外线下的典型老化。所以户外环氧上面要加耐候面漆（topcoat）。"},
 {t:"mcq",q:"The zinc blocks on the pier legs are almost gone, and the steel around them is rusting. What failed?",qc:"码头桩腿上的锌块几乎消耗光了，周围钢材开始生锈，什么失效了？",o:["Cathodic protection — the sacrificial anodes are used up","The antifouling","The dehumidifier","The draft marks"],term:"sacrificial anode",e:"牺牲阳极耗尽，阴极保护（cathodic protection）就失效了，需要更换阳极。"},
 {t:"mcq",q:"Below the waterline the legs are crusted with barnacles and sea weed. Before any survey, you first:",qc:"水下桩腿长满藤壶和海藻，检查前第一步：",o:["Remove the fouling with high-pressure fresh water","Paint over it","Measure the DFT","Apply putty"],term:"barnacle/acorn barnacle",e:"先 HPFW 冲掉海生物和盐分，才能看到真正的锈蚀等级。"},
 {t:"q",sec:"42-16",en:"The little girl's voice rose, soft and uncertain, as she tried to hum the funeral dirge.",cn:"稚嫩的童声轻轻哼起了那首送灵曲。"},
 {t:"n",cn:"弗丽嘉播放了过去的影像。卡列尼娜为遇难者唱完送灵曲，再次启航。"}
]},
{sec:"42-17",title:"我们，被淹没的",en:"We, the Drowned",depth:260,place:"蜃岛 · 灯塔",nodes:[
 {t:"q",sec:"42-17",en:"By linking the lighthouse to the undersea database, they managed to piece together a makeshift communications station on the island.",cn:"借由灯塔与海底数据库的链接，岛上的临时通讯站勉强搭建了起来。"},
 {t:"q",sec:"42-17",...LEE,en:"And this island is now your temporary base?",cn:"那座小岛现在是临时据点？"},
 {t:"n",cn:"灯塔的天线基座锈穿了。要让通讯站撑下去，你得带着幸存者把它重新涂装。涂料说明书上写着：体积固含量 64%，规定干膜 160 µm。"},
 {t:"mcq",q:"Before the full coat, which areas get a stripe coat by brush?",qc:"满涂之前，哪些部位要先用刷子做预涂（stripe coat）？",o:["Edges, welds, corners and bolt heads","Only flat plates","Only the top surface","Nowhere — spray is enough"],term:"stripe coat",e:"边缘和焊缝处喷涂的膜会被拉薄，最先生锈，所以要先刷一道预涂。"},
 {t:"mcq",q:"Volume solids 64 %, specified DFT 160 µm, no thinner. Target wet film thickness?",qc:"固含量 64%，干膜 160 µm，不加稀释剂，湿膜应是？",o:["250 µm","102 µm","224 µm","160 µm"],term:"wet film thickness",e:"WFT = DFT × 100 ÷ VS% = 160 × 100 ÷ 64 = 250 µm。喷的时候用湿膜卡随时测。"},
 {t:"mcq",q:"The primer went on 40 days ago, longer than the maximum recoating interval. Before the next coat you must:",qc:"底漆已经涂了 40 天，超过最大复涂间隔，下一道之前必须：",o:["Clean and abrade (sweep) the surface as the data sheet requires","Apply a double-thick coat","Just recoat — it's fine","Heat it with a torch"],term:"recoating interval",e:"超过复涂间隔层间附着力会变差，要按说明书打毛或扫砂。"},
 {t:"drill",d:2},
 {t:"n",cn:"夜里，柯黛里娅当年种在山巅的矢车菊在风里轻轻摇。"}
]},
{sec:"42-19",title:"协议缓冲",en:"Protocol Buffer",depth:900,place:"蜃岛地下 · 曼南机械体内部",nodes:[
 {t:"n",cn:"沉睡在岛下的曼南型机器人被唤醒。卡列尼娜让没有战斗能力的人先上船离岛，自己独自迎战。"},
 {t:"q",sec:"42-19",...K,en:"Didn't I tell you to evacuate with the others?!",cn:"我不是……让你和大家一起撤离吗！？"},
 {t:"q",sec:"42-19",en:"At last, the tip strikes something solid. A pale gray alloy pod.",cn:"终于，机械臂的尖端碰到了一个坚硬的表面——灰白色的合金舱。"},
 {t:"q",sec:"42-19",en:"Deep dive pod.",cn:"深潜舱。"},
 {t:"n",cn:"深潜舱是密闭空间，空气已经几十年没换过。进去之前，你得先把安全步骤说清楚。"},
 {t:"drill",d:5}
]},
{sec:"42-20",title:"溺亡风中",en:"Drowned in the Wind",depth:900,place:"回忆 · 卡列宁号",nodes:[
 {t:"n",cn:"拉拉纳的记忆把你们带回过去：试图穿越气旋的卡列宁号断成了两截。"},
 {t:"q",sec:"42-20",...LA,en:"Right. All the watertight doors in the main corridor need to be sealed.",cn:"是，得把主通道的所有水密门都关掉。"},

/* ---------- voice: Claude tts / dictation, falling back to the browser ---------- */
let TTS=null,DICT=null,ttsBlocked=false,RATE=1,dictNoLang=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
/* Device voices: many Android phones (and in-app browsers like WeChat / QQ) have speechSynthesis but no English voice,
   so speak() silently does nothing. Pick an English voice explicitly and fall back to Youdao dictionary audio for terms. */
const SS=window.speechSynthesis||null;
let EN_VOICE=null,VOICE_SRC=store.get("vsrc","auto");
function loadVoices(){if(!SS)return;const vs=SS.getVoices()||[];EN_VOICE=vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;deviceBadges()}

let toastT=null;
function toast(msg){let el=$("#toast");if(!el){el=document.createElement("div");el.id="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},6000)}
const NO_VOICE_MSG="这台手机没有可用的英文语音。请用 Chrome 或 Safari 打开（不要用微信/QQ 内置浏览器），或在系统设置 → 文字转语音 里安装英文语音包。单词可以把“发音”切到“有道”。";
function deviceBadges(){
  const t=$("#dev-tts"),m=$("#dev-mic");
  const tOK=!ttsBlocked&&(TTS||EN_VOICE||VOICE_SRC!=="device");
  t.className="pill "+(tOK?"on":"off");t.lastChild.textContent=TTS?"朗读：Claude 语音":EN_VOICE?"朗读：本机英文语音":"朗读：本机无英文语音，单词用有道";

const isTerm=t=>t.split(/\s+/).length<=4&&!/[.?!,;]/.test(t);
let AUDIO=null;
function youdao(text,onFail){
  try{if(AUDIO)AUDIO.pause()}catch(e){}
  const q=primary(text).replace(/\s+/g," ").trim();
  AUDIO=new Audio("https://dict.youdao.com/dictvoice?type=2&audio="+encodeURIComponent(q).replace(/%20/g,"+"));
  AUDIO.playbackRate=RATE;AUDIO.onerror=()=>onFail&&onFail();
  const p=AUDIO.play();if(p&&p.catch)p.catch(()=>onFail&&onFail());
}
function speakDevice(text,onFail){
  if(!SS||!EN_VOICE){onFail&&onFail();return}
  if(SS.speaking||SS.pending)SS.cancel();
  try{SS.resume()}catch(e){}
  const u=new SpeechSynthesisUtterance(text);u.voice=EN_VOICE;u.lang=EN_VOICE.lang;u.rate=RATE;
  let started=false;u.onstart=()=>{started=true};u.onerror=ev=>{if(!started&&ev.error!=="interrupted"&&ev.error!=="canceled")onFail&&onFail()};
  SS.speak(u);
  setTimeout(()=>{if(!started&&!SS.speaking){SS.cancel();onFail&&onFail()}},1800);
}
function say(text){
  if(ttsBlocked)return;
  if(TTS){TTS.speak(text,{language:"en",rate:RATE}).catch(e=>{if(e&&e.code==="not_granted"){ttsBlocked=true;deviceBadges()}});return}
  const term=isTerm(text),fail=()=>toast(term?"这个词的在线发音不可用。"+NO_VOICE_MSG:NO_VOICE_MSG);
  if(VOICE_SRC==="youdao"||(VOICE_SRC==="auto"&&!EN_VOICE)){
    if(term)youdao(text,()=>speakDevice(text,fail));else speakDevice(text,fail);
    return;
  }
  speakDevice(text,()=>term?youdao(text,fail):fail());
}
/* listen(): call straight from a click. ui = {btn, heard}; done(text|null, reason) */
let listening=null;
function listen(ui,done){
  if(listening){listening.stop();return}
  let fin="",ended=false,timer=null;
  const finish=(reason)=>{if(ended)return;ended=true;listening=null;ui.btn.classList.remove("live");done(fin.trim(),reason)};
  if(DICT){
    const offs=[
      DICT.onPartial(({text})=>{ui.heard.textContent=(fin+text).trim()||"…"}),
      DICT.onFinal(({text})=>{fin+=text;ui.heard.textContent=fin.trim();clearTimeout(timer);timer=setTimeout(()=>DICT.stop().catch(()=>{}),1600)}),
      DICT.onState(({state,reason})=>{if(state==="listening"){ui.btn.classList.add("live");ui.heard.textContent="正在听… 说完会自动停止"}
        if(state==="idle"){offs.forEach(f=>f());clearTimeout(timer);finish(reason||"stopped")}})
    ];
    listening={stop:()=>DICT.stop().catch(()=>{})};
    DICT.start(dictNoLang?undefined:{language:"en"}).catch(e=>{
      offs.forEach(f=>f());
      if(e.code==="unavailable"&&!dictNoLang){dictNoLang=true;ui.heard.textContent="英语听写不可用，已切换为默认语言，请再点一次"}
      finish(e.code)});
    return;
  }
  if(SR){
    const r=new SR();r.lang="en-US";r.interimResults=true;r.maxAlternatives=1;
    r.onresult=ev=>{let inter="";fin="";for(const res of ev.results){if(res.isFinal)fin+=res[0].transcript+" ";else inter+=res[0].transcript}ui.heard.textContent=(fin+inter).trim()};
    r.onerror=ev=>finish(ev.error);r.onend=()=>finish("stopped");
    listening={stop:()=>r.stop()};
    try{r.start();ui.btn.classList.add("live");ui.heard.textContent="正在听…"}catch(e){finish("unavailable")}
    return;
  }
  done(null,"unavailable");
}

/* ---------- scoring ---------- */
const norm=s=>s.toLowerCase().replace(/½/g," and a half").replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(Boolean);
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);
function wordMatch(said,target){
  const s=norm(said),t=norm(target);
  const marks=t.map(tw=>s.some(sw=>sw===tw||sim(sw,tw)>=0.75));
  return {t,marks,pct:t.length?Math.round(100*marks.filter(Boolean).length/t.length):0};
}
function bestMatch(said,en){let best=null;for(const v of variantsOf(en)){const r=wordMatch(said,v);if(!best||r.pct>best.pct)best=r}return best}

const loose=s=>s.toLowerCase().replace(/[\s\-_.()]/g,"");
function nextSpell(){
  const p=pool(SP.cat),box=$("#sp");if(!p.length){box.innerHTML=`<div class="empty">这一组没有词。</div>`;return}
  const w=pickWeighted(p);SP.cur=w;SP.tries=0;const t=primary(w.en);

function checkSpell(){
  const w=SP.cur,v=$("#sp-in").value.trim();if(!v)return;

  SP.tries++;

  award(w.id,ok,15);

function dewPoint(T,RH){const a=17.62,b=243.12,g=Math.log(RH/100)+a*T/(b+T);return b*g/(a-g)}
function renderCalc(){
  $("#inb").innerHTML=`<div class="grid2">
  <div class="panel"><h3>露点检查 Dew point check</h3><div class="sub">用干湿球或电子湿度计测出的数据填进来（Magnus 公式近似）。</div>
   <div class="calc" style="margin-top:10px"><label>气温 Air °C<input type="number" id="c-t" value="20" step="0.1"></label><label>湿度 RH %<input type="number" id="c-rh" value="85" step="1" min="1" max="100"></label><label>钢板 Steel °C<input type="number" id="c-s" value="19" step="0.1"></label></div>
   <div class="readout" id="c-out"></div></div>
  <div class="panel"><h3>湿膜 / 涂布率 WFT & coverage</h3><div class="sub">按涂料说明书的体积固含量计算。</div>
   <div class="calc" style="margin-top:10px"><label>干膜 DFT µm<input type="number" id="w-d" value="160" step="5"></label><label>固含量 VS %<input type="number" id="w-v" value="65" step="1"></label><label>稀释 Thinner %<input type="number" id="w-th" value="5" step="1"></label></div>
   <div class="calc" style="margin-top:10px"><label>面积 Area m²<input type="number" id="w-a" value="1200" step="10"></label><label>损耗 Loss %<input type="number" id="w-l" value="40" step="5"></label></div>
   <div class="readout" id="w-out"></div></div></div>`;
  const upd=()=>{
    const T=+$("#c-t").value,RH=+$("#c-rh").value,St=+$("#c-s").value,dp=dewPoint(T,RH),diff=St-dp,ok=diff>=3&&RH<=85;

const QS=store.get("qs",{});  // question index -> {c: correct streak, n: attempts}
function recordQ(i,ok){const s=QS[i]||{c:0,n:0};s.n++;s.c=ok?s.c+1:0;QS[i]=s;store.set("qs",QS)}
const qIdx=k=>QB.map((q,i)=>q.m===k?i:-1).filter(i=>i>=0);
function modMastery(k){const ids=qIdx(k);return ids.length?ids.reduce((a,i)=>a+Math.min(2,(QS[i]||{}).c||0),0)/(2*ids.length):0}

/* ----- progressive path ----- */
const PATH=store.get("path",{done:{},steps:{}});

const lIdx=k=>LESSONS.findIndex(l=>l.k===k);

      const I=lInfo(l),ok=!!PATH.done[l.k],open=unlocked(i),n=l.exam?0:STEPS.filter(([s])=>stepDone(l.k,s)).length;
      const act=l.act!=null?` · 解锁冒险 ${CHAPTERS[l.act].sec}`:"";
      return `<div class="task ${ok?"done":""}" style="${open?"":"opacity:.55"}"><span class="box">${ok?"✓":open?"":"🔒"}</span><div class="tt">${i+1}. ${esc(I.t)}<small>${esc(I.en)}${l.exam?` · 模拟考 ${EXAM_PASS}% 过关`:` · ${n}/5 步`}${act}</small></div><button class="btn ghost" data-open="${l.k}" ${open?"":"disabled"}>${ok?"复习":open?"进入":"未解锁"}</button></div>`}).join("")}</div>`).join("");
  const r1=lvReady(1),r2=lvReady(2);
  V().innerHTML=`<h2>CIP 学习路线</h2><p class="lede">从船舶英语开始，按 CIP 一级、二级课程顺序一课一课往前走。每课五步：<b>记词 → 读要点 → 练习 → 开口 → 关卡</b>，关卡 5 题对 4 题才解锁下一课，同时解锁对应的冒险章节。课程顺序按 AMPP CIP 课程主题整理，细节以最新教材为准。</p>
   <div class="ready"><div class="panel"><div class="lv">路线进度</div><div class="pct">${doneN}/${LESSONS.length}</div><div class="gauge"><i style="width:${100*doneN/LESSONS.length}%"></i></div></div>
    <div class="panel"><div class="lv">题库掌握度</div><div style="font-family:var(--f-mono);font-size:13px;margin-top:6px">Level 1 ${Math.round(r1*100)}% · Level 2 ${Math.round(r2*100)}%</div><div class="row" style="margin-top:8px"><button class="chip" id="free">按模块自由练习 / 随时模拟考</button></div></div></div>
   ${card}${rows}`;
  V().querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openLesson(b.dataset.open));

   <div class="chips" id="stp" style="margin-top:12px">${STEPS.map(([s,n],i)=>{const d=stepDone(l.k,s),can=i===0||stepDone(l.k,STEPS[i-1][0])||d;return `<button class="chip" data-s="${s}" aria-pressed="${s===PLAN.step}" ${can?"":"disabled"} style="${can?"":"opacity:.45"}">${d?"✓ ":i+1+". "}${n}</button>`}).join("")}</div>

function finishStep(l,s,msg){

/* generic multiple choice inside the lesson box */
function lessonMcq(box,head,opts,exp,onDone){
  box.innerHTML=`${head}<div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(o.t)}</span></button>`).join("")}</div><div id="lfb"></div>`;
  let done=false;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(done)return;done=true;const i=+b.dataset.i,ok=opts[i].ok;
    box.querySelectorAll(".opt").forEach((bb,j)=>{bb.disabled=true;if(opts[j].ok)bb.classList.add("right");else if(j===i)bb.classList.add("wrong")});
    const right=opts.find(o=>o.ok).t;
    $("#lfb").innerHTML=`<div class="fb"><div class="verdict ${ok?"ok":"no"}">${ok?"正确":"正确答案："+esc(right)}</div>${exp?`<p style="margin:6px 0 0">${exp}</p>`:""}<div class="row" style="margin-top:10px"><button class="btn ghost" data-say="${esc(right)}">▶</button><button class="btn" data-next id="lnext">继续 ↵</button></div></div>`;
    $("#lnext").onclick=()=>onDone(ok);
  });
}
function vocabQ(w,dir){
  const same=shuffle(VOCAB.filter(x=>x.cat===w.cat&&x.id!==w.id&&x.cn!==w.cn&&x.en.toLowerCase()!==w.en.toLowerCase())).slice(0,3);
  const en2cn=dir==="en2cn";
  return {head:`<div class="meta"><span>术语</span></div><div class="prompt ${en2cn?"":"cn"}" style="font-size:clamp(22px,5vw,32px)">${esc(en2cn?w.en:w.cn)}</div><div class="sub">${en2cn?"选出中文意思":"选出英文术语"}</div>`,
    opts:shuffle([w,...same]).map(x=>({t:en2cn?x.cn:x.en,ok:x===w})),exp:esc(w.cn+" = "+w.en)};
}
function bankQ(qi){const q=QB[qi];return {head:`<div class="meta"><span>${esc(q.r)}</span></div><div style="font-size:18px;font-weight:600;line-height:1.45">${esc(q.q)} <button class="icon-btn" data-say="${esc(q.q.replace(/___/g,"blank"))}">▶</button></div><div class="sub" style="margin-top:4px">${esc(q.qc)}</div>`,
  opts:shuffle(q.o.map((t,i)=>({t,ok:i===q.a}))),exp:esc(q.e)}}
function stVocab(l,box){
  const T=lTerms(l),st=PLAN.st;st.i=st.i||0;st.ph=st.ph||"learn";
  if(st.ph==="learn"){
    const w=T[st.i];
    box.innerHTML=`<div class="meta"><span>记词 · 先看先听</span><span>${st.i+1} / ${T.length}</span></div>
     <div class="prompt">${esc(w.en)}</div><div class="prompt cn" style="font-size:22px;color:var(--muted)">${esc(w.cn)}</div>
     ${w.note?`<div class="note">原表更正：${esc(w.note)}</div>`:""}${w.ex.length&&!w.gen?exampleHTML(w):""}
     <div class="row" style="margin-top:14px"><button class="btn ghost" data-say="${esc(primary(w.en))}">▶ 听发音</button><button class="btn ghost" id="vp" ${st.i?"":"disabled"}>上一个</button><button class="btn" data-next id="vn">${st.i<T.length-1?"下一个 ↵":"开始自测 ↵"}</button></div>`;
    say(primary(w.en));

    $("#vn").onclick=()=>{if(st.i<T.length-1)st.i++;else{st.ph="test";st.i=0;st.ok=0;st.order=shuffle(T)}stVocab(l,box)};
    return;

    box.innerHTML=`<h3>自测 ${st.ok}/${st.order.length}</h3>${pass?"":`<p>没到 70%，再看一遍这些词再测。</p><button class="btn" id="vr">重新记词</button>`}`;
    if(pass)finishStep(l,"vocab",`记住了 ${st.ok}/${st.order.length} 个`);else $("#vr").onclick=()=>{PLAN.st={};stVocab(l,box)};

  lessonMcq(box,q.head.replace('<span>术语</span>',`<span>自测</span><span>${st.i+1} / ${st.order.length}</span>`),q.opts,q.exp,ok=>{award(w.id,ok);if(ok)st.ok++;st.i++;stVocab(l,box)});
}
function stPoints(l,box,I){

function stPractice(l,box){

  });

function stCheck(l,box){
  const st=PLAN.st;
  if(!st.items){
    const T=shuffle(lTerms(l));
    st.items=l.mod?shuffle(qIdx(l.mod)).slice(0,3).map(qi=>({qi})).concat(T.slice(0,2).map(w=>({w}))):T.slice(0,5).map(w=>({w}));

   <div class="dewtbl"><div><small>Air temp</small><b>${nd.T} °C</b></div><div><small>RH</small><b>${nd.RH} %</b></div><div><small>Steel temp</small><b>${nd.St} °C</b></div></div>
   <div class="opts"><button class="opt" data-a="go"><kbd>1</kbd><span>Proceed — start spraying · 开喷</span></button><button class="opt" data-a="hold"><kbd>2</kbd><span>Hold — conditions not acceptable · 暂停</span></button></div><div id="afb"></div></div>`;
  act.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const ok=(b.dataset.a==="go")===go;act.querySelectorAll(".opt").forEach(bb=>{bb.disabled=true;if((bb.dataset.a==="go")===go)bb.classList.add("right");else if(bb===b)bb.classList.add("wrong")});
    award(null,ok,20);if(!ok)hurt(15);else bond(2);
    $("#afb").innerHTML=`<div class="fb"><div class="verdict ${ok?"ok":"no"}">${ok?"判断正确 +20 XP":"漆膜结露，三个月后起泡剥落 · 船体 −15%"}</div>
     <p style="margin:6px 0 0;font-family:var(--f-mono);font-size:13px">Dew point ≈ ${dp.toFixed(1)} °C · steel is ${diff.toFixed(1)} °C above · RH ${nd.RH} %</p>
     <p style="margin:4px 0 0">规则：钢板温度至少高于露点 3 °C，相对湿度不超过 85%。${go?"两条都满足，可以施工。":"这里不满足，必须暂停，开除湿机后复测。"}</p></div>`;
    $("#afb").appendChild(contBtn({ok,txt:(ok?"✓ ":"✗ ")+"Dew point "+dp.toFixed(1)+" °C → "+(go?"Proceed":"Hold")}));scrollEnd();
  });
}
function micBlock(placeholder){return `<div class="row" style="margin-top:12px;gap:14px"><button class="mic" id="mic" aria-label="开始/停止录音">${MIC_SVG}</button><div style="flex:1;min-width:0"><div class="heard" id="heard">点麦克风开始说，说完自动停止</div></div></div>
  <form class="row" id="typed" style="margin-top:10px" autocomplete="off"><input type="text" id="typed-in" placeholder="${placeholder}" style="flex:1 1 200px"><button class="btn ghost" type="submit">提交</button></form>`}
function wireMic(onText){
  const ui={btn:$("#mic"),heard:$("#heard")};
  ui.btn.onclick=()=>listen(ui,(text,reason)=>{if(text)onText(text);else ui.heard.textContent=text===null?REASON.unavailable:(REASON[reason]||"没听到内容，再试一次。")});
  $("#typed").onsubmit=e=>{e.preventDefault();const v=$("#typed-in").value.trim();if(v)onText(v)};
}
function advSpeak(nd,act){
  const target=nd.en==="@choice"?(AD.lastChoice||"Take your time. I'm right here."):nd.en;let fails=0;
  act.innerHTML=`<div class="chal"><div class="tag">开口说 · 70 分过关</div><p style="margin:4px 0">${esc(nd.cn)}</p>
   <div class="prompt" style="font-size:clamp(20px,4.6vw,28px)">${esc(target)}</div><div class="row"><button class="btn ghost" data-say="${esc(target)}">▶ 听示范</button></div>
   ${micBlock("不能录音时：把你说的打出来")}<div id="afb"></div><div class="row" style="margin-top:10px"><button class="btn ghost" id="skip">跳过（信任 −2）</button></div></div>`;
  $("#skip").onclick=()=>{bond(-2);advNext({ok:false,txt:"⏭ 跳过："+target})};
  wireMic(text=>{
    const r=wordMatch(text,target),ok=r.pct>=70;$("#heard").textContent="听到："+text;
    if(ok){award(null,true,20);bond(2)}else{fails++;S.streak=0;renderStats()}
    $("#afb").innerHTML=`<div class="fb"><div class="row" style="gap:16px"><div class="score" style="color:var(${ok?"--ok":r.pct>=50?"--accent":"--bad"})">${r.pct}</div><div style="min-width:0"><div class="verdict ${ok?"ok":"no"}">${ok?"过关 +20 XP":"再试一次：先听示范，注意红色的词"}</div><div class="words">${r.t.map((w,i)=>`<span class="${r.marks[i]?"h":"m"}">${esc(w)}</span>`).join("")}</div></div></div></div>`;
    if(ok||fails>=2)$("#afb").appendChild(contBtn({ok,txt:"🎙 "+r.pct+" 分 · "+target}));
    scrollEnd();
  });
}
function advDrill(nd,act){
  const d=DRILLS[nd.d];
  act.innerHTML=`<div class="chal"><div class="tag">口语答辩 · ${esc(d.t)}</div><p style="margin:4px 0">${esc(d.s)}</p>
   <div class="kw" id="kw">${d.k.map(k=>`<span>${esc(k[0])}</span>`).join("")}</div>
   ${micBlock("不能录音时：打字作答")}<div id="afb"></div><div class="row" style="margin-top:10px"><button class="btn ghost" id="skip">看示范并跳过（信任 −2）</button></div></div>`;
  const finish=(ok,n)=>{$("#afb").insertAdjacentHTML("beforeend",modelHTML(d));$("#afb").appendChild(contBtn({ok,txt:"🎙 答辩「"+d.t+"」关键词 "+n+"/"+d.k.length}));$("#skip").remove();scrollEnd()};
  $("#skip").onclick=()=>{bond(-2);$("#afb").innerHTML="";finish(false,0)};
  wireMic(text=>{
    const low=" "+norm(text).join(" ")+" ",hit=d.k.map(alts=>alts.some(a=>low.includes(" "+norm(a).join(" ")+" ")));
    const n=hit.filter(Boolean).length,need=Math.ceil(d.k.length*0.6),ok=n>=need;
    $("#kw").innerHTML=d.k.map((k,i)=>`<span class="${hit[i]?"h":""}">${esc(k[0])}</span>`).join("");$("#heard").textContent="听到："+text;
    $("#afb").innerHTML=`<div class="fb"><div class="verdict ${ok?"ok":"no"}">关键词 ${n}/${d.k.length}${ok?" · 通过 +30 XP":" · 至少要用到 "+need+" 个，可以再说一次"}</div></div>`;
    if(ok){award(null,true,30);bond(3);finish(true,n)}
  });
}
function advChoice(nd,act){
  act.innerHTML=`<div class="chal"><div class="tag">你的选择</div><p style="margin:4px 0">${esc(nd.cn)}</p><div class="opts" style="grid-template-columns:1fr">${nd.o.map((o,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(o.en)}<br><small style="color:var(--muted)">${esc(o.cn)}</small></span></button>`).join("")}</div></div>`;
  act.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const o=nd.o[+b.dataset.i];AD.lastChoice=o.en;bond(o.trust);advNext({ok:o.trust>=0,txt:"你：“"+o.en+"”",reply:o.r})});
}
function advCloze(nd,act){
  const items=shuffle(STORY.filter(w=>!w.gen)).slice(0,nd.n);let k=0,good=0;
  const one=()=>{
    if(k>=items.length){act.innerHTML="";act.appendChild(contBtn({ok:good===items.length,txt:"📖 日志修复 "+good+"/"+items.length}));scrollEnd();return}
    const w=items[k],x=w.ex[0],re=new RegExp("\\b"+x.hit.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");
    const others=[...new Set(shuffle(STORY.filter(o=>!o.gen&&o.ex[0].hit.toLowerCase()!==x.hit.toLowerCase())).map(o=>o.ex[0].hit.toLowerCase()))].slice(0,3);
    const opts=shuffle([x.hit.toLowerCase(),...others]);
    act.innerHTML=`<div class="chal"><div class="tag">残缺日志 ${k+1}/${items.length} · 原文 ${esc(x.sec)}</div><div style="font-size:18px;line-height:1.5;margin-top:6px">${esc(x.en).replace(re,'<span class="blank">____</span>')}</div><div class="sub cnq">${esc(x.cn)}</div>
     <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(o)}</span></button>`).join("")}</div><div id="afb"></div></div>`;
    act.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i,ok=opts[i]===x.hit.toLowerCase();if(ok)good++;else hurt(5);award(w.id,ok,15);learn(w.id);
      act.querySelectorAll(".opt").forEach((bb,j)=>{bb.disabled=true;if(opts[j]===x.hit.toLowerCase())bb.classList.add("right");else if(j===i)bb.classList.add("wrong")});
      $("#afb").innerHTML=`<div class="fb"><div class="verdict ${ok?"ok":"no"}">${ok?"修复成功":"答案是 "+esc(x.hit)}</div><div>${esc(w.en)} — ${esc(w.cn)} <button class="icon-btn" data-say="${esc(x.en)}">▶ 整句</button></div><div class="row" style="margin-top:10px"><button class="btn cont" id="cont">下一条 ▸</button></div></div>`;
      $("#cont").onclick=()=>{k++;one()};scrollEnd();
    });
  };
  one();
}
function chapterEnd(act){
  const last=AD.ch>=CHAPTERS.length-1;
  if(last)return ending(act);
  const N=CHAPTERS[AD.ch+1],need=LESSONS.find(l=>l.act===AD.ch+1);
  if(need&&!PATH.done[need.k]&&AD.ch+1>AD.max){
    act.innerHTML=`<div class="chal"><div class="tag">下一幕未解锁</div><div class="cq">${esc(N.sec)} ${esc(N.title)} 需要先完成学习路线第 ${lIdx(need.k)+1} 课「${esc(lInfo(need).t)}」</div><div class="sub">先把这一课的考点学会，故事里的现场判断才答得上。</div><button class="btn accent cont" id="cont">去学习 ▸</button></div>`;
    $("#cont").onclick=()=>{go("plan");openLesson(need.k)};return;
  }
  act.innerHTML=`<div class="chal"><div class="tag">本幕结束</div><div class="cq">下一幕：${esc(N.sec)} ${esc(N.title)} · ${esc(N.en)}</div><div class="sub">${esc(N.place)} · 深度 ${N.depth.toLocaleString()} m</div><button class="btn accent cont" id="cont">继续航行 ▸</button></div>`;
  $("#cont").onclick=()=>{AD.ch++;AD.step=0;AD.max=Math.max(AD.max,AD.ch);advSave();VIEWS.adv();window.scrollTo({top:0})};
}
function ending(act){
  const h=AD.hull,t=AD.trust;
  const [title,desc]=h>=80&&t>=70?["Senior Coating Inspector","船体几乎完好，卡列尼娜把六分仪的另一半交给了你。你的每一次签字都站得住。"]
    :h>=50?["Coating Inspector","巴德尔号带着几处补漆回到港口。合格，但还有进步空间。去训练舱把错题本清空吧。"]
    :["Inspector Trainee","船体伤痕累累。好在大家都回来了。重新出航，把露点、表面处理和漆病再过一遍。"];
  const words=AD.learned.map(i=>VOCAB[i]).filter(Boolean);
  act.innerHTML=`<div class="chal endcard"><div class="tag">终章 · 自海深深处，致海深深处</div><div class="big">${title}</div><p>${desc}</p>
   <p style="font-family:var(--f-mono);font-size:13px">船体完整度 ${h}% · 信任 ${t} · XP ${S.xp} · 本次航行学会 ${words.length} 个术语</p>
   <div class="kw">${words.map(w=>`<span class="h" title="${esc(w.cn)}">${esc(primary(w.en))}</span>`).join("")}</div>
   <div class="row" style="margin-top:12px"><button class="btn accent" id="again">重新出航</button><button class="btn ghost" id="toq">去训练舱刷错题</button></div></div>`;
  $("#again").onclick=()=>{AD=newAdv();advSave();VIEWS.adv()};$("#toq").onclick=()=>{QZ.cat=S.wrong.size?"wrong":"coating";go("quiz")};
}
function shipwreck(act){
  act.innerHTML=`<div class="chal"><div class="tag">船体完整度归零</div><div class="cq">涂层大面积失效，巴德尔号被拖回船坞返修。</div><p class="sub">失败的检测判断会一层层累积成腐蚀。回到本幕开头重新来过，船体恢复到 60%。</p><button class="btn accent cont" id="cont">重来本幕</button></div>`;
  $("#cont").onclick=()=>{AD.hull=60;AD.step=0;Object.keys(AD.rec).forEach(k=>{if(k.startsWith(AD.ch+"-"))delete AD.rec[k]});advSave();VIEWS.adv()};
}
function chapterMenu(){
  const act=$("#act");
  act.innerHTML=`<div class="chal"><div class="tag">选择章节 · 已解锁 ${AD.max+1}/${CHAPTERS.length}</div><div class="chlist">${CHAPTERS.map((c,i)=>`<button class="opt" data-i="${i}" ${i>AD.max?"disabled":""}><kbd>${c.sec}</kbd><span>${esc(c.title)} · ${esc(c.en)}${i>AD.max?" 🔒":""}</span></button>`).join("")}</div><button class="btn ghost cont" id="ch-x">关闭</button></div>`;
  act.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{AD.ch=+b.dataset.i;AD.step=0;Object.keys(AD.rec).forEach(k=>{if(k.startsWith(AD.ch+"-"))delete AD.rec[k]});advSave();VIEWS.adv();window.scrollTo({top:0})});
  $("#ch-x").onclick=()=>VIEWS.adv();scrollEnd();
}
function logMenu(){
  const act=$("#act"),words=AD.learned.map(i=>VOCAB[i]).filter(Boolean);
  act.innerHTML=`<div class="chal"><div class="tag">航海日志 · 本次航行遇到的术语</div>${words.length?`<div class="tbl-wrap" style="margin-top:8px"><table><tbody>${words.map(w=>`<tr><td>${esc(w.cn)}</td><td class="en">${esc(w.en)}</td><td><button class="icon-btn" data-say="${esc(primary(w.en))}">▶</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="sub">还没有记录。答对现场判断题后，术语会记进日志。</p>`}<button class="btn ghost cont" id="lg-x">关闭</button></div>`;
  $("#lg-x").onclick=()=>VIEWS.adv();scrollEnd();
}

/* ---------- boot ---------- */
function start(d){renderStats();const h=(location.hash||"").slice(1);go((d&&d.tab)||(VIEWS[h]&&h!=="home"?h:"plan"))}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({tab:TAB}));
hot&&hot.ready?hot.ready(start):start((hot&&hot.data)||{});
</script>

</body>
</html>
